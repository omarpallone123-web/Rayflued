<style>
:root{--bg:#161616;--bg2:#222;--bg3:#2c2c2c;--tx:#ececec;--mut:#a3a19b;--ac:#d9775a;--ln:#363636;--inv:#f4f3ee;--invt:#161616;--f:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-th=light]{--bg:#faf9f5;--bg2:#efede4;--bg3:#e4e1d6;--tx:#1f1e1d;--mut:#6b6a65;--ln:#d9d6ca;--inv:#1f1e1d;--invt:#faf9f5}
html[data-f=sans]{--f:"Helvetica Neue",Arial,sans-serif}html[data-f=serif]{--f:Georgia,"Times New Roman",serif}html[data-f=mono]{--f:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:12px}
.ib:active{background:var(--bg2)}
main{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column}
#welcome{margin:auto;text-align:center;padding-bottom:40px}
#welcome h1{font-family:Georgia,serif;font-weight:400;font-size:1.45rem;margin-top:10px}
.plan{display:inline-block;margin-top:20px;background:var(--bg2);color:var(--mut);padding:8px 18px;border-radius:999px;font-size:.8rem}
.plan button{color:var(--tx);font-weight:600}
#sgs{display:flex;flex-direction:column;gap:8px;margin-top:22px;align-items:center}
#sgs button{background:var(--bg2);border-radius:999px;padding:9px 16px;font-size:.82rem;color:var(--mut)}
#msgs{padding:8px 0 20px;display:flex;flex-direction:column;gap:22px}
.m{line-height:1.55;font-size:.9rem;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--bg2);padding:10px 16px;border-radius:18px;max-width:86%}
.m.a{display:flex;gap:12px}.m.a .lg{margin-top:2px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.comp{margin:0 10px 10px;background:var(--bg2);border:1px solid var(--ln);border-radius:20px;padding:10px 10px 8px}
.comp textarea{width:100%;background:none;border:0;outline:0;resize:none;max-height:140px;line-height:1.4;padding:2px 4px;font-size:.95rem}
.comp textarea::placeholder{color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}.row .sp{flex:1}
.rb{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:grid;place-items:center}
.chip{background:var(--bg3);border-radius:999px;padding:8px 14px;font-size:.8rem}.chip span{color:var(--mut);margin-left:6px}
.send{background:var(--ac);color:#fff}.send:disabled{opacity:.45}
.rb.rec2{background:var(--ac)}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#dr{position:absolute;top:0;bottom:0;left:0;width:80%;max-width:300px;background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 0;transform:translateX(-102%);transition:transform .25s;z-index:6;display:flex;flex-direction:column;border-right:1px solid var(--ln)}
.open #ov{opacity:1;pointer-events:auto}.open #dr{transform:none}
#dr h2{font-family:Georgia,serif;font-weight:400;font-size:1.5rem;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:.92rem;width:100%;text-align:left}
hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.recl{color:var(--mut);font-size:.8rem;margin:4px 0 4px 2px}
#list{flex:1;overflow-y:auto}
.it{display:flex;gap:12px;align-items:center;padding:9px 4px;width:100%;text-align:left;font-size:.85rem;border-radius:10px}
.it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:600;color:#fff;font-size:.85rem}
.nw{background:var(--inv);color:var(--invt);border-radius:999px;padding:10px 18px;font-size:.88rem;font-weight:500;display:flex;gap:6px;align-items:center}
/* sheets & rows */
.sheet{position:absolute;inset:0;z-index:12;display:none}.sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .22s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-h{display:flex;align-items:center;padding:4px 6px 14px;font-weight:600;font-size:1rem}
.sh-h button{width:32px;height:32px;display:grid;place-items:center}
.sh-h span{flex:1;text-align:center;margin-right:32px}
.grp{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.grp:empty{display:none}
.opt{background:var(--bg2);padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.opt b{font-weight:400;font-size:.95rem;display:block}
.opt small{color:var(--mut);font-size:.78rem;display:block;margin-top:2px;line-height:1.35}
.opt em{font-style:normal;color:var(--mut);font-size:.85rem}
.opt.red b{color:#e0706a}
.sp2{flex:1;min-width:0}
.ri{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;flex:none}
.tag{background:#23324d;color:#7fb0ff;font-size:.66rem;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.tag.warn{background:#3a2a10;color:#f0a020}
.ft{color:var(--mut);font-size:.8rem;line-height:1.45;padding:0 6px;margin-bottom:12px}
.ki{width:100%;background:none;border:0;outline:0;font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--bg2);border-radius:14px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.85rem;cursor:pointer}
.tile i{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:grid;place-items:center}
.fi{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
.sw{width:44px;height:26px;border-radius:999px;background:#777;position:relative;transition:background .2s;flex:none;display:block}

.free{background:var(--inv);color:var(--invt);border-radius:999px;padding:5px 12px;font-size:.75rem;font-weight:600}
.promo{border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.promo h4{font-size:1rem;margin-bottom:6px}.promo p{font-size:.9rem;line-height:1.4;margin-bottom:14px}
.promo button{background:var(--inv);color:var(--invt);border-radius:999px;padding:9px 18px;font-size:.88rem;font-weight:500}
/* call */
#cl{position:absolute;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 24px 40px}
#cl.on{display:flex}

#cl .stt{color:var(--mut);font-size:.9rem;margin-top:6px;min-height:1.2em;text-align:center}
.orb{width:120px;height:120px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;margin:0 auto}
.orb.l{animation:pu 1.8s infinite}.orb.s{animation:pu .9s infinite}

.cbt{display:flex;gap:28px}
.cbt button{width:62px;height:62px;border-radius:50%;background:var(--bg3);display:grid;place-items:center}
.cbt .end{background:#d6453d;color:#fff}.cbt .off{background:var(--inv);color:var(--invt)}
/* auth */
