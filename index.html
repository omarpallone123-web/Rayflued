<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDZ HUB AI</title>
<style>
  :root{
    --neon: #ff0033;
    --neon2: #ff2b4d;
    --bg: #050505;
    --panel: #0d0d0d;
    --panel2: #121212;
    --border: #2a0000;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background: radial-gradient(circle at 50% 0%, #1a0000 0%, #000 70%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color:#f5f5f5;
    overflow:hidden;
  }

  /* ---------- INTRO SPLASH ---------- */
  #splash{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    z-index:9999;
    transition: background 0.8s ease;
  }
  #splash img{
    width:280px;
    max-width:60vw;
    filter: drop-shadow(0 0 25px var(--neon)) drop-shadow(0 0 60px rgba(255,0,51,0.6));
    animation: introPulse 1.8s ease-in-out 1;
  }
  @keyframes introPulse{
    0%{ transform:scale(0.3) rotate(-8deg); opacity:0; filter: drop-shadow(0 0 0px var(--neon)); }
    40%{ transform:scale(1.15) rotate(3deg); opacity:1; filter: drop-shadow(0 0 45px var(--neon)) drop-shadow(0 0 90px var(--neon2)); }
    70%{ transform:scale(0.95) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  #splash.shrink img{
    animation: shrinkAway 0.9s cubic-bezier(.6,-0.28,.74,.05) forwards;
  }
  @keyframes shrinkAway{
    0%{ transform:scale(1) translate(0,0); opacity:1; }
    100%{ transform:scale(0.09) translate(-42vw,-42vh); opacity:0.9; }
  }
  #splash.hide{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- APP LAYOUT ---------- */
  #app{
    display:flex;
    height:100vh;
    opacity:0;
    transition: opacity 0.8s ease 0.3s;
  }
  #app.show{ opacity:1; }

  /* Sidebar */
  #sidebar{
    width:260px;
    background: linear-gradient(180deg, #0a0000 0%, #050505 100%);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:14px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .brand img{
    width:38px;height:38px;
    border-radius:8px;
    filter: drop-shadow(0 0 8px var(--neon));
  }
  .brand span{
    font-weight:800;
    letter-spacing:1px;
    text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon2);
    color:#fff;
  }
  .btn{
    display:flex;align-items:center;gap:8px;
    background: var(--panel2);
    border:1px solid var(--border);
    color:#eee;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    margin-bottom:8px;
    transition: all .2s ease;
  }
  .btn:hover{
    border-color: var(--neon);
    box-shadow: 0 0 12px rgba(255,0,51,0.5);
    color:#fff;
  }
  #newChatBtn{
    background: linear-gradient(90deg, #3a0000, #1a0000);
    font-weight:600;
  }
  #clearChatBtn{ color:#ff8080; }

  #historyList{
    flex:1;
    overflow-y:auto;
    margin-top:10px;
    display:flex;flex-direction:column;gap:6px;
  }
  .hist-item{
    padding:9px 10px;
    background: var(--panel);
    border:1px solid #1c0000;
    border-radius:7px;
    font-size:13px;
    color:#ccc;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
  }
  .hist-item:hover{ border-color: var(--neon); color:#fff; }
  .hist-item.active{ border-color: var(--neon); box-shadow:0 0 10px rgba(255,0,51,.4); color:#fff; }
  .hist-del{
    color:#888; font-size:13px; padding:0 4px; flex-shrink:0;
  }
  .hist-del:hover{ color: var(--neon); }

  .sidebar-footer{
    font-size:11px;
    color:#666;
    text-align:center;
    padding-top:10px;
    border-top:1px solid var(--border);
  }

  /* Main column */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    background: radial-gradient(circle at 50% -10%, #150000 0%, #000 60%);
  }

  header{
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{
    font-size:16px;
    margin:0;
    letter-spacing:2px;
    color:#fff;
    text-shadow: 0 0 8px var(--neon);
  }

  #apiKeyBar{
    display:flex;
    gap:8px;
    align-items:center;
  }
  #apiKeyBar input{
    background: var(--panel2);
    border:1px solid var(--border);
    color:#eee;
    padding:8px 10px;
    border-radius:7px;
    font-size:13px;
    width:230px;
    outline:none;
  }
  #apiKeyBar input:focus{
    border-color: var(--neon);
    box-shadow: 0 0 10px rgba(255,0,51,0.5);
  }
  #apiKeyBar button{
    background: var(--neon);
    border:none;
    color:#fff;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
    box-shadow: 0 0 10px rgba(255,0,51,0.6);
  }
  #apiKeyBar button:hover{ background: var(--neon2); }
  #keyStatus{ font-size:12px; color:#4dff88; min-width:60px; }

  #chatWindow{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:70%;
    padding:12px 15px;
    border-radius:12px;
    line-height:1.4;
    font-size:14px;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background: linear-gradient(135deg, #4a0000, #2a0000);
    border:1px solid var(--neon);
    box-shadow: 0 0 12px rgba(255,0,51,0.35);
  }
  .msg.bot{
    align-self:flex-start;
    background: var(--panel2);
    border:1px solid #330000;
  }
  .msg.system{
    align-self:center;
    color:#999;
    font-size:12px;
    background:none;
  }

  #inputBar{
    display:flex;
    gap:10px;
    padding:16px 20px;
    border-top:1px solid var(--border);
  }
  #inputBar textarea{
    flex:1;
    resize:none;
    background: var(--panel2);
    border:1px solid var(--border);
    color:#eee;
    padding:12px;
    border-radius:9px;
    font-size:14px;
    outline:none;
    font-family:inherit;
    height:48px;
  }
  #inputBar textarea:focus{
    border-color: var(--neon);
    box-shadow: 0 0 12px rgba(255,0,51,0.5);
  }
  #sendBtn{
    background: var(--neon);
    border:none;
    color:#fff;
    padding:0 22px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
    box-shadow: 0 0 14px rgba(255,0,51,0.6);
  }
  #sendBtn:hover{ background: var(--neon2); }
  #sendBtn:disabled{ opacity:0.5; cursor:not-allowed; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#330000; border-radius:4px; }
  ::-webkit-scrollbar-track{ background:#000; }
</style>
</head>
