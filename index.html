<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI - Roblox Script Generator</title>
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #12161f;
            --bg-chat: #181e2a;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.25);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --user-msg: #1f293d;
            --bot-msg: #162234;
            --code-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .modal-box h2 {
            margin-bottom: 10px;
            color: var(--accent);
        }

        .modal-box p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid #2d3748;
            border-radius: 6px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-box input:focus {
            border-color: var(--accent);
        }

        .modal-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-box button:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #21262d;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            background: #0d1117;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .model-tag {
            font-size: 0.75rem;
            background: #1f293d;
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 10px;
            border: 1px solid var(--accent);
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-msg);
            border: 1px solid #2d3e50;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid #1e2d42;
        }

        pre {
            background: var(--code-bg);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            border: 1px solid #30363d;
            position: relative;
        }

        code {
            font-family: 'Consolas', 'Courier New', monospace;
            color: #58a6ff;
            font-size: 0.85rem;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .input-area {
            padding: 15px;
            background: #0d1117;
            border-top: 1px solid #21262d;
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg-chat);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            resize: none;
            height: 50px;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="apiModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Inserisci Chiave Groq</h2>
            <p>Inserisci la tua API Key di Groq per iniziare. Verrà salvata unicamente nel tuo browser.</p>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." />
            <button onclick="saveApiKey()">Salva e Continua</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div style="display: flex; align-items: center;">
                <h1>⚡ Groq Executor Bot</h1>
                <span id="modelTag" class="model-tag">Ricerca modello...</span>
            </div>
            <button class="btn-reset" onclick="clearApiKey()">Cambia API Key</button>
        </div>

        <div class="messages-box" id="messagesBox">
            <div class="msg bot">
                Ciao! Sono pronto a generare script Luau, comandi o <code>loadstring</code> per il tuo executor Roblox. Cosa vorresti creare oggi?
            </div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Es: Creami uno script fly per mobile executor o un loadstring con GUI..."></textarea>
            <button class="send-btn" onclick="sendMessage()">Invia</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('GROQ_API_KEY') || '';
        let activeModel = 'llama3-70b-8192'; // Fallback predefinito
        
        const systemPrompt = `Sei un assistente AI specializzato nello sviluppo di script Luau e nella generazione di comandi loadstring per executor Roblox (come Delta Executor, Solara, Fluxus, Hydrogen, ecc.). 
Rispondi in modo diretto. Quando l'utente chiede uno script, fornisci codice pulito, ben ottimizzato per mobile/PC e, quando opportuno, fornisci il relativo comando loadstring o il blocco di codice Luau pronti da copiare.`;

        let chatHistory = [];

        window.onload = async () => {
            if (!apiKey) {
                document.getElementById('apiModal').classList.remove('hidden');
            } else {
                document.getElementById('apiModal').classList.add('hidden');
                await autoDetectModel();
            }
        };

        async function autoDetectModel() {
            try {
                const res = await fetch('https://api.groq.com/openai/v1/models', {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    // Cerca il miglior modello disponibile
                    const preferred = data.data.find(m => m.id.includes('llama3-70b') || m.id.includes('llama-3.3') || m.id.includes('mixtral'));
                    if (preferred) {
                        activeModel = preferred.id;
                    } else {
                        activeModel = data.data[0].id;
                    }
                }
            } catch (e) {
                console.warn('Impossibile recuperare lista modelli, uso di fallback:', activeModel);
            }
            document.getElementById('modelTag').innerText = activeModel;
        }

        async function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key.startsWith('gsk_')) {
                apiKey = key;
                localStorage.setItem('GROQ_API_KEY', key);
                document.getElementById('apiModal').classList.add('hidden');
                await autoDetectModel();
            } else {
                alert('Inserisci una API Key valida di Groq (inizia con gsk_)');
            }
        }

        function clearApiKey() {
            localStorage.removeItem('GROQ_API_KEY');
            location.reload();
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            appendMessage('user', userText);
            inputField.value = '';

            chatHistory.push({ role: "user", content: userText });

            const botMsgDiv = appendMessage('bot', 'Elaborazione script in corso...');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            ...chatHistory
                        ],
                        temperature: 0.5
                    })
                });

                const data = await response.json();

                if (data.error) {
                    botMsgDiv.innerHTML = `⚠️ Errore API: ${data.error.message}`;
                    return;
                }

                const botReply = data.choices[0].message.content;
                chatHistory.push({ role: "assistant", content: botReply });
                
                botMsgDiv.innerHTML = formatMarkdown(botReply);

            } catch (err) {
                botMsgDiv.innerHTML = '⚠️ Errore di connessione con le API di Groq.';
            }

            const box = document.getElementById('messagesBox');
            box.scrollTop = box.scrollHeight;
        }

        function appendMessage(role, text) {
            const box = document.getElementById('messagesBox');
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            msg.innerHTML = role === 'user' ? text : formatMarkdown(text);
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
            return msg;
        }

        function formatMarkdown(content) {
            let formatted = content.replace(/```(?:luau|lua|javascript|html)?\n([\s\S]*?)```/g, function(match, p1) {
                return `<pre><code>${escapeHtml(p1.trim())}</code><button class="copy-btn" onclick="copyCode(this)">Copia</button></pre>`;
            });
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            return formatted.replace(/\n/g, '<br>');
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyCode(btn) {
            const code = btn.previousElementSibling.innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = 'Copiato!';
                setTimeout(() => btn.innerText = 'Copia', 2000);
            });
        }

        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
