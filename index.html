<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Redz Hub AI</title>
<style>
  :root{
    --bg:#060608;
    --bg-2:#0c0c12;
    --purple:#9b30ff;
    --pink:#ff2fd0;
    --gradient: linear-gradient(135deg, var(--purple), var(--pink));
    --card:#111116;
    --card-2:#16161d;
    --text:#f2f2f7;
    --text-dim:#9a9aa5;
    --border: rgba(155,48,255,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:600px;
    margin:0 auto;
    position:relative;
    background:
      radial-gradient(circle at 20% 0%, rgba(155,48,255,0.12), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(255,47,208,0.10), transparent 35%),
      var(--bg);
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 10px 16px;
    flex-shrink:0;
  }
  .menu-btn, .profile-btn{
    background:none;
    border:none;
    color:var(--text);
    width:42px;height:42px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .menu-btn:active, .profile-btn:active{ transform:scale(0.9); background:rgba(255,255,255,0.06);}
  .profile-btn{ border:1.5px solid var(--purple); color:var(--pink);}
  .title-wrap{ text-align:center; flex:1; }
  .title-wrap h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .title-wrap h1 span.ai{
    background:var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    margin:2px 0 0 0;
    font-size:0.72rem;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }

  /* MODEL SELECTOR ROW */
  .model-row{
    display:flex;
    gap:8px;
    padding:0 16px 12px 16px;
    flex-shrink:0;
  }
  .model-select{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:8px 14px;
    position:relative;
    cursor:pointer;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .model-select:active{ box-shadow:0 0 0 3px rgba(155,48,255,0.15); }
  .model-select label{
    font-size:0.68rem;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .model-select .model-name{
    font-size:0.95rem;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .model-select select{
    position:absolute;
    inset:0;
    opacity:0;
    width:100%;
    height:100%;
    cursor:pointer;
  }
  .chevron{ transition:transform .2s ease; color:var(--text-dim); }
  .model-select.open .chevron{ transform:rotate(180deg); }

  .clear-btn{
    width:52px;
    background:var(--card);
    border:1.5px solid rgba(255,47,208,0.4);
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    color:#ff5fd8;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .clear-btn:active{ transform:scale(0.9); background:rgba(255,47,208,0.12); }

  /* CHAT AREA */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:8px 14px 16px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .msg-block{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
    animation: fadeSlideIn .28s ease both;
  }
  @keyframes fadeSlideIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .msg-row{
    display:flex;
    gap:10px;
    align-items:flex-end;
    max-width:100%;
  }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.ai{ justify-content:flex-start; }

  .avatar{
    width:38px;height:38px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:0.95rem;
    border:1.5px solid var(--purple);
    background:#0c0c12;
    color:var(--pink);
  }
  .bubble{
    max-width:78%;
    padding:12px 14px;
    border-radius:18px;
    font-size:0.95rem;
    line-height:1.5;
    word-wrap:break-word;
    position:relative;
  }
  .msg-row.user .bubble{
    background:linear-gradient(135deg, #6b21c9, #7a1fae);
    color:#fff;
    border-bottom-right-radius:6px;
  }
  .msg-row.ai .bubble{
    background:var(--card-2);
    color:var(--text);
    border-bottom-left-radius:6px;
    border:1px solid rgba(255,255,255,0.05);
  }
  .bubble p{ margin:0 0 6px 0; }
  .bubble ul{ margin:4px 0; padding-left:20px; }
  .bubble a{ color:#ff9dee; text-decoration:underline; }
  .bubble .inline-code{
    background:rgba(255,255,255,0.08);
    padding:1px 5px;
    border-radius:5px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;
    font-size:0.85em;
  }
  .bubble .code-block{
    background:#08080c;
    border:1px solid rgba(155,48,255,0.25);
    border-radius:10px;
    padding:10px 12px;
    overflow-x:auto;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;
    font-size:0.82rem;
    margin:6px 0;
    white-space:pre;
  }
  .meta-time{
    display:block;
    font-size:0.65rem;
    margin-top:6px;
    opacity:0.6;
    text-align:right;
  }
  .msg-actions{
    display:flex;
    gap:6px;
    padding:0 4px;
  }
  .msg-row.user + .msg-actions{ justify-content:flex-end; padding-right:4px; }
  .msg-row.ai + .msg-actions{ justify-content:flex-start; padding-left:48px; }
  .msg-actions button{
    background:none;
    border:none;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:4px;
    font-size:0.68rem;
    cursor:pointer;
    padding:3px 6px;
    border-radius:8px;
    transition:color .2s ease, background .2s ease;
  }
  .msg-actions button:active{ background:rgba(255,255,255,0.06); color:var(--text); }
  .msg-actions button.copied{ color:#4ade80; }

  /* Loading dots */
  .typing{
    display:flex;
    gap:5px;
    padding:6px 4px;
    align-items:center;
  }
  .typing span{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--pink);
    display:inline-block;
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-6px); opacity:1; }
  }
  .cursor-blink{
    display:inline-block;
    width:2px;height:1em;
    background:var(--pink);
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* INPUT BAR */
  .input-bar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    background:linear-gradient(to top, rgba(6,6,8,1), rgba(6,6,8,0.95));
    border-top:1px solid rgba(255,255,255,0.06);
  }
  #textInput{
    flex:1;
    background:var(--card);
    border:1.5px solid rgba(155,48,255,0.25);
    border-radius:22px;
    padding:12px 16px;
    color:var(--text);
    font-size:0.95rem;
    outline:none;
    resize:none;
    max-height:110px;
    line-height:1.3;
    font-family:inherit;
    transition:border-color .2s ease;
  }
  #textInput:focus{ border-color:var(--purple); }
  #textInput::placeholder{ color:var(--text-dim); }

  .send-btn{
    width:48px;height:48px;
    border-radius:50%;
    border:none;
    background:var(--gradient);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(155,48,255,0.4);
    transition:transform .15s ease, opacity .2s ease;
  }
  .send-btn:active{ transform:scale(0.88); }
  .send-btn:disabled{ opacity:0.5; }

  /* BOTTOM NAV */
  .bottom-nav{
    flex-shrink:0;
    display:flex;
    justify-content:space-around;
    padding:10px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    background:var(--bg-2);
    border-top:1px solid rgba(255,255,255,0.05);
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:0.68rem;
    cursor:pointer;
    padding:4px 10px;
    transition:color .2s ease, transform .15s ease;
  }
  .nav-item.active{ color:var(--pink); }
  .nav-item:active{ transform:scale(0.92); }

  /* SIDE MENU */
  .overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:20;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .side-menu{
    position:absolute;
    top:0;left:0;
    height:100%;
    width:78%;
    max-width:300px;
    background:var(--bg-2);
    border-right:1px solid var(--border);
    transform:translateX(-105%);
    transition:transform .32s cubic-bezier(.25,.9,.3,1);
    z-index:21;
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .side-menu.open{ transform:translateX(0); }
  .side-menu h2{
    font-size:1.1rem;
    margin:0 0 16px 4px;
    background:var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  .side-menu button{
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    color:var(--text);
    font-size:0.95rem;
    text-align:left;
    padding:12px 10px;
    border-radius:12px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .side-menu button:active{ background:rgba(155,48,255,0.15); }

  /* Scrollbar hide */
  #chat::-webkit-scrollbar{ width:0px; }

  /* Modals */
  .modal{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
    padding:20px;
  }
  .modal.show{ display:flex; }
  .modal-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    width:100%;
    max-width:360px;
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-card h3{ margin-top:0; }
  .modal-card label{ font-size:0.8rem; color:var(--text-dim); }
  .modal-card input[type="text"], .modal-card textarea{
    width:100%;
    background:var(--card-2);
    border:1px solid rgba(155,48,255,0.3);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    margin:8px 0 14px 0;
    font-size:0.9rem;
    outline:none;
    font-family:inherit;
  }
  .modal-card textarea{ resize:vertical; min-height:80px; line-height:1.4; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .modal-actions button{
    padding:10px 16px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:600;
  }
  .btn-cancel{ background:var(--card-2); color:var(--text); }
  .btn-save{ background:var(--gradient); color:#fff; }

  /* History list */
  .history-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .history-empty{ color:var(--text-dim); font-size:0.85rem; text-align:center; padding:20px 0; }
  .history-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card-2);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .history-item:active{ background:rgba(155,48,255,0.15); }
  .history-item .hi-info{ flex:1; min-width:0; }
  .history-item .hi-title{
    font-size:0.9rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .history-item .hi-date{ font-size:0.68rem; color:var(--text-dim); margin-top:2px; }
  .history-item .hi-del{
    background:none;border:none;color:#ff5fd8;
    display:flex;align-items:center;justify-content:center;
    padding:6px;cursor:pointer;flex-shrink:0;
  }
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="title-wrap">
      <h1>Redz Hub <span class="ai">AI</span></h1>
      <p class="subtitle">Powered by Groq • Ultra Fast AI Chat</p>
    </div>
    <button class="profile-btn" id="profileBtn" aria-label="Profilo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
  </header>

  <!-- MODEL SELECTOR -->
  <div class="model-row">
    <div class="model-select" id="modelSelectWrap">
      <label>Model</label>
      <div class="model-name">
        <span id="modelLabel">GPT-OSS 20B (Groq)</span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <select id="modelSelect">
        <option value="openai/gpt-oss-20b" selected>GPT-OSS 20B (Groq)</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B (Groq)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant (Groq)</option>
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B Versatile (Groq)</option>
        <option value="qwen/qwen3.6-27b">Qwen 3.6 27B (Groq)</option>
      </select>
    </div>
    <button class="clear-btn" id="clearBtn" aria-label="Nuova chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  </div>

  <!-- CHAT -->
  <div id="chat"></div>

  <!-- INPUT -->
  <div class="input-bar">
    <textarea id="textInput" rows="1" placeholder="Scrivi un messaggio..."></textarea>
    <button class="send-btn" id="sendBtn" aria-label="Invia">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-item active" data-tab="chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Chat
    </button>
    <button class="nav-item" data-tab="models">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Models
    </button>
    <button class="nav-item" data-tab="history">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
    <button class="nav-item" data-tab="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>

  <!-- SIDE MENU -->
  <div class="overlay" id="overlay"></div>
  <div class="side-menu" id="sideMenu">
    <h2>Redz Hub AI</h2>
    <button id="menuNewChat">🆕 Nuova chat</button>
    <button id="menuHistory">🕘 Cronologia</button>
    <button id="menuModels">🧠 Modelli Groq</button>
    <button id="menuSettings">⚙️ Impostazioni</button>
    <button id="menuAbout">ℹ️ Info</button>
  </div>

  <!-- SETTINGS MODAL (API key + system prompt) -->
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h3>Impostazioni</h3>
      <label>Groq API Key (salvata solo su questo dispositivo)</label>
      <input type="text" id="apiKeyInput" placeholder="YOUR_GROQ_API_KEY">
      <label>Messaggio di sistema dell'AI</label>
      <textarea id="systemPromptInput" placeholder="Es: Sei un assistente utile, rispondi in italiano in modo chiaro e diretto."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="settingsCancel">Annulla</button>
        <button class="btn-save" id="settingsSave">Salva</button>
      </div>
    </div>
  </div>

  <!-- HISTORY MODAL -->
  <div class="modal" id="historyModal">
    <div class="modal-card">
      <h3>Cronologia chat</h3>
      <div class="history-list" id="historyList"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="historyClose">Chiudi</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   REDZ HUB AI - Groq Chat Interface
   -------------------------------------------------------
   COME COLLEGARE GROQ API:
   1) Ottieni una API key gratuita su https://console.groq.com
   2) Apri Impostazioni (menu ☰ o tab in basso) e incolla la chiave.
      In alternativa sostituisci qui sotto GROQ_API_KEY per test rapidi.
   3) NON pubblicare mai la tua chiave reale in un file
      condiviso pubblicamente (es. GitHub pubblico).
   La chiave e il system prompt vengono salvati in localStorage,
   quindi restano solo sul dispositivo dell'utente.
   ========================================================= */

const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
const DEFAULT_SYSTEM_PROMPT = "Sei Redz Hub AI, un assistente virtuale utile, amichevole e diretto. Rispondi in italiano salvo diversa richiesta dell'utente.";

let GROQ_API_KEY = localStorage.getItem('redzhub_apikey') || "YOUR_GROQ_API_KEY";
let systemPrompt = localStorage.getItem('redzhub_system_prompt') || DEFAULT_SYSTEM_PROMPT;
let currentModel = localStorage.getItem('redzhub_model') || "openai/gpt-oss-20b";
let chatHistory = []; // {role:'user'|'assistant', content:'...'}
let currentConvId = null;

const chatEl = document.getElementById('chat');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');
const modelLabel = document.getElementById('modelLabel');
const clearBtn = document.getElementById('clearBtn');

const menuBtn = document.getElementById('menuBtn');
const sideMenu = document.getElementById('sideMenu');
const overlay = document.getElementById('overlay');

const settingsModal = document.getElementById('settingsModal');
const apiKeyInput = document.getElementById('apiKeyInput');
const systemPromptInput = document.getElementById('systemPromptInput');

const historyModal = document.getElementById('historyModal');
const historyList = document.getElementById('historyList');

/* ---------- UTILS ---------- */
function nowTime(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function genId(){
  return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}
function escapeHtmlRaw(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* Markdown leggero: code block, inline code, bold, italic, link, liste */
function renderMarkdown(raw){
  let text = escapeHtmlRaw(raw);
  text = text.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m,lang,code)=>{
    return '<pre class="code-block"><code>' + code.replace(/\n$/,'') + '</code></pre>';
  });
  text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
  text = text.replace(/\*\*([^\*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\*)\*([^\*\n]+)\*(?!\*)/g, '<em>$1</em>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = text.split('\n');
  let html = '', inList = false;
  for(const line of lines){
    if(/^\s*[-*]\s+/.test(line) && !line.includes('<pre')){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + line.replace(/^\s*[-*]\s+/, '') + '</li>';
    }else{
      if(inList){ html += '</ul>'; inList = false; }
      html += line + (line.trim()==='' ? '' : '<br>');
    }
  }
  if(inList) html += '</ul>';
  return html;
}
function scrollToBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

/* ---------- RENDER MESSAGGI ---------- */
function addMessage(role, text){
  const block = document.createElement('div');
  block.className = 'msg-block';

  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

  if(role !== 'user'){
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'R';
    row.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.dataset.raw = text;
  bubble.innerHTML = renderMarkdown(text) + '<span class="meta-time">' + nowTime() + '</span>';
  row.appendChild(bubble);
  block.appendChild(row);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML =
    '<button class="act-copy">📋 Copia</button>' +
    '<button class="act-share">↗️ Condividi</button>';
  actions.querySelector('.act-copy').addEventListener('click', ()=> copyText(bubble.dataset.raw, actions.querySelector('.act-copy')));
  actions.querySelector('.act-share').addEventListener('click', ()=> shareText(bubble.dataset.raw));
  block.appendChild(actions);

  chatEl.appendChild(block);
  scrollToBottom();
  return bubble;
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    if(btn){
      const original = btn.textContent;
      btn.textContent = '✅ Copiato';
      btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1500);
    }
  }).catch(()=>{ alert('Impossibile copiare il testo.'); });
}
function shareText(text){
  if(navigator.share){
    navigator.share({ text: text }).catch(()=>{});
  }else{
    copyText(text, null);
    alert('Condivisione non supportata: testo copiato negli appunti.');
  }
}

function showTyping(){
  const block = document.createElement('div');
  block.className = 'msg-block';
  block.id = 'typingBlock';
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'R';
  row.appendChild(avatar);
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(bubble);
  block.appendChild(row);
  chatEl.appendChild(block);
  scrollToBottom();
}
function hideTyping(){
  const block = document.getElementById('typingBlock');
  if(block) block.remove();
}

/* Crea una bolla vuota per lo streaming e la restituisce insieme al block */
function createStreamingBubble(){
  const block = document.createElement('div');
  block.className = 'msg-block';
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'R';
  row.appendChild(avatar);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.dataset.raw = '';
  bubble.innerHTML = '<span class="cursor-blink"></span>';
  row.appendChild(bubble);
  block.appendChild(row);
  chatEl.appendChild(block);
  scrollToBottom();
  return { block, bubble };
}
function finalizeStreamingBubble(block, bubble, fullText){
  bubble.dataset.raw = fullText;
  bubble.innerHTML = renderMarkdown(fullText) + '<span class="meta-time">' + nowTime() + '</span>';
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML =
    '<button class="act-copy">📋 Copia</button>' +
    '<button class="act-share">↗️ Condividi</button>';
  actions.querySelector('.act-copy').addEventListener('click', ()=> copyText(bubble.dataset.raw, actions.querySelector('.act-copy')));
  actions.querySelector('.act-share').addEventListener('click', ()=> shareText(bubble.dataset.raw));
  block.appendChild(actions);
  scrollToBottom();
}

/* ---------- CRONOLOGIA (localStorage) ---------- */
function loadConversations(){
  try{
    return JSON.parse(localStorage.getItem('redzhub_conversations') || '[]');
  }catch(e){ return []; }
}
function saveConversations(list){
  localStorage.setItem('redzhub_conversations', JSON.stringify(list));
}
function saveCurrentConversation(){
  if(chatHistory.length === 0) return;
  const list = loadConversations();
  const firstUserMsg = chatHistory.find(m => m.role === 'user');
  const title = firstUserMsg ? firstUserMsg.content.slice(0,40) : 'Nuova conversazione';
  if(!currentConvId){ currentConvId = genId(); }
  const idx = list.findIndex(c => c.id === currentConvId);
  const convObj = { id: currentConvId, title, messages: chatHistory.slice(), updatedAt: Date.now() };
  if(idx >= 0){ list[idx] = convObj; } else { list.unshift(convObj); }
  saveConversations(list);
}
function renderHistoryList(){
  const list = loadConversations().sort((a,b)=> b.updatedAt - a.updatedAt);
  historyList.innerHTML = '';
  if(list.length === 0){
    historyList.innerHTML = '<div class="history-empty">Nessuna conversazione salvata.</div>';
    return;
  }
  list.forEach(conv=>{
    const item = document.createElement('div');
    item.className = 'history-item';
    const date = new Date(conv.updatedAt);
    const dateStr = date.toLocaleDateString('it-IT') + ' ' + date.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    item.innerHTML =
      '<div class="hi-info"><div class="hi-title"></div><div class="hi-date">'+dateStr+'</div></div>' +
      '<button class="hi-del" aria-label="Elimina">🗑️</button>';
    item.querySelector('.hi-title').textContent = conv.title || 'Conversazione';
    item.addEventListener('click', (e)=>{
      if(e.target.closest('.hi-del')) return;
      loadConversation(conv.id);
    });
    item.querySelector('.hi-del').addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteConversation(conv.id);
    });
    historyList.appendChild(item);
  });
}
function loadConversation(id){
  const list = loadConversations();
  const conv = list.find(c => c.id === id);
  if(!conv) return;
  currentConvId = conv.id;
  chatHistory = conv.messages.slice();
  chatEl.innerHTML = '';
  chatHistory.forEach(m => addMessage(m.role, m.content));
  closeHistoryModal();
  closeMenu();
}
function deleteConversation(id){
  let list = loadConversations();
  list = list.filter(c => c.id !== id);
  saveConversations(list);
  if(currentConvId === id){
    currentConvId = null;
    chatHistory = [];
    chatEl.innerHTML = '';
    addMessage('assistant', "Conversazione eliminata ✅\nCome posso aiutarti ora?");
  }
  renderHistoryList();
}
function openHistoryModal(){ renderHistoryList(); historyModal.classList.add('show'); }
function closeHistoryModal(){ historyModal.classList.remove('show'); }

/* ---------- INVIO MESSAGGIO / STREAMING ---------- */
async function sendMessage(){
  const text = textInput.value.trim();
  if(!text) return;

  addMessage('user', text);
  chatHistory.push({role:'user', content:text});
  saveCurrentConversation();
  textInput.value = '';
  autoResize();
  sendBtn.disabled = true;

  const noKey = (!GROQ_API_KEY || GROQ_API_KEY === "YOUR_GROQ_API_KEY");

  if(noKey){
    showTyping();
    await new Promise(r => setTimeout(r, 800));
    hideTyping();
    const demoReply = "🔧 Modalità demo: nessuna API key Groq valida impostata.\n\nPer collegare Groq API reale:\n1. Vai su console.groq.com\n2. Crea una API key gratuita\n3. Inseriscila da Impostazioni ⚙️ (menu o tab in basso)";
    addMessage('assistant', demoReply);
    chatHistory.push({role:'assistant', content:demoReply});
    saveCurrentConversation();
    sendBtn.disabled = false;
    return;
  }

  const { block, bubble } = createStreamingBubble();
  let fullText = '';

  try{
    const messagesPayload = [{role:'system', content: systemPrompt}, ...chatHistory];

    const response = await fetch(GROQ_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: currentModel,
        messages: messagesPayload,
        temperature: 0.7,
        max_tokens: 1024,
        stream: true
      })
    });

    if(!response.ok){
      let detail = "";
      try{
        const errData = await response.json();
        detail = errData.error?.message || JSON.stringify(errData);
      }catch(e){
        detail = await response.text().catch(()=> "");
      }
      throw new Error("HTTP " + response.status + (detail ? " - " + detail : ""));
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if(payload === '[DONE]') continue;
        try{
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content;
          if(delta){
            fullText += delta;
            bubble.innerHTML = renderMarkdown(fullText) + '<span class="cursor-blink"></span>';
            scrollToBottom();
          }
        }catch(e){ /* ignora chunk parziali non validi */ }
      }
    }

    finalizeStreamingBubble(block, bubble, fullText || "Nessuna risposta ricevuta.");
    chatHistory.push({role:'assistant', content: fullText || "Nessuna risposta ricevuta."});
    saveCurrentConversation();

  }catch(err){
    block.remove();
    const errMsg = "⚠️ Errore nella richiesta a Groq API.\nControlla la tua API key, il modello e la connessione.\n\nDettagli: " + err.message;
    addMessage('assistant', errMsg);
  }finally{
    sendBtn.disabled = false;
  }
}

function autoResize(){
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
}

/* ---------- EVENTI BASE ---------- */
sendBtn.addEventListener('click', sendMessage);
textInput.addEventListener('input', autoResize);
textInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

modelSelect.addEventListener('change', (e)=>{
  currentModel = e.target.value;
  modelLabel.textContent = e.target.options[e.target.selectedIndex].text;
  localStorage.setItem('redzhub_model', currentModel);
});
/* imposta label iniziale in base al modello salvato */
(function initModelLabel(){
  const opt = Array.from(modelSelect.options).find(o => o.value === currentModel);
  if(opt){ modelSelect.value = currentModel; modelLabel.textContent = opt.text; }
})();

clearBtn.addEventListener('click', ()=>{
  saveCurrentConversation();
  chatEl.innerHTML = '';
  chatHistory = [];
  currentConvId = null;
  addMessage('assistant', "Nuova chat iniziata ✅\nCome posso aiutarti ora?");
});

/* ---------- MENU LATERALE ---------- */
function openMenu(){
  sideMenu.classList.add('open');
  overlay.classList.add('show');
}
function closeMenu(){
  sideMenu.classList.remove('open');
  overlay.classList.remove('show');
}
menuBtn.addEventListener('click', openMenu);
overlay.addEventListener('click', ()=>{
  closeMenu();
  settingsModal.classList.remove('show');
  closeHistoryModal();
});

document.getElementById('menuNewChat').addEventListener('click', ()=>{
  closeMenu();
  clearBtn.click();
});
document.getElementById('menuHistory').addEventListener('click', ()=>{
  closeMenu();
  openHistoryModal();
});
document.getElementById('menuModels').addEventListener('click', ()=>{
  closeMenu();
  modelSelect.focus();
});
document.getElementById('menuSettings').addEventListener('click', ()=>{
  closeMenu();
  openSettingsModal();
});
document.getElementById('menuAbout').addEventListener('click', ()=>{
  closeMenu();
  addMessage('assistant', "Redz Hub AI ⚡\nUltra Fast AI Chat powered by Groq.\nInterfaccia mobile-first, dark mode, con cronologia locale, risposte in streaming e messaggio di sistema personalizzabile.");
});

/* ---------- IMPOSTAZIONI ---------- */
function openSettingsModal(){
  apiKeyInput.value = (GROQ_API_KEY === "YOUR_GROQ_API_KEY") ? "" : GROQ_API_KEY;
  systemPromptInput.value = systemPrompt;
  settingsModal.classList.add('show');
}
document.getElementById('settingsCancel').addEventListener('click', ()=>{
  settingsModal.classList.remove('show');
});
document.getElementById('settingsSave').addEventListener('click', ()=>{
  const val = apiKeyInput.value.trim();
  GROQ_API_KEY = val || "YOUR_GROQ_API_KEY";
  localStorage.setItem('redzhub_apikey', GROQ_API_KEY);

  const sp = systemPromptInput.value.trim();
  systemPrompt = sp || DEFAULT_SYSTEM_PROMPT;
  localStorage.setItem('redzhub_system_prompt', systemPrompt);

  settingsModal.classList.remove('show');
  addMessage('assistant', GROQ_API_KEY === "YOUR_GROQ_API_KEY"
    ? "Impostazioni salvate. Nessuna API key impostata: resto in modalità demo."
    : "✅ Impostazioni salvate (API Key e messaggio di sistema aggiornati).");
});

/* ---------- CRONOLOGIA MODAL ---------- */
document.getElementById('historyClose').addEventListener('click', closeHistoryModal);

/* ---------- BOTTOM NAV ---------- */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    if(tab === 'models'){ modelSelect.focus(); }
    if(tab === 'settings'){ openSettingsModal(); }
    if(tab === 'history'){ openHistoryModal(); }
  });
});

/* ---------- INIT ---------- */
window.addEventListener('load', ()=>{
  addMessage('assistant', "Ciao! 👋\nSono Redz Hub AI, alimentato da Groq 🚀\nCome posso aiutarti oggi?");
});
</script>
