<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochi</title>
<style>
:root{--bg:#000;--side:#080808;--card:#111;--tx:#f2f2f2;--mu:#8a8a8a;--bd:#222;--ac:#fff;--ac2:#fff;--user:#1c1c1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
#side{width:270px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .25s;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand img,.av{border-radius:50%;object-fit:cover;background:#000}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:contain}.hl{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#000;display:none}
button{font:inherit;color:inherit;cursor:pointer}
#new{display:flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;font-weight:600}
#hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.h{display:flex;align-items:center;border-radius:10px;padding:8px 10px;color:var(--mu);font-size:14px;cursor:pointer;gap:6px}
.h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h:hover,.h.on{background:var(--card);color:var(--tx)}
.h b{display:none;font-weight:400;border:0;background:none;color:var(--mu)}
.h:hover b{display:block}
.lbl{font-size:12px;color:var(--mu);padding:6px 10px 2px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px}
#menu{display:none;border:0;background:none;font-size:22px}
header .t{font-weight:500;font-size:20px}
header .sp{flex:1}
.ib{border:1px solid var(--bd);background:var(--bg);border-radius:50%;width:36px;height:36px}
#chat{flex:1;overflow:auto;padding:0 16px}
.wrap{max-width:760px;margin:0 auto}
#hero{text-align:left;padding-top:9vh}
#hero img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#000}
#hero h1{font-size:clamp(34px,8vw,56px);font-weight:500;margin:0 0 26px;line-height:1.15;color:var(--tx);line-height:1.2}
#hero p{color:var(--mu);margin:0 0 28px;font-size:clamp(26px,6vw,46px);font-weight:500;line-height:1.2;opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:10px;text-align:left}
.chip{background:var(--card);border:0;border-radius:999px;padding:11px 18px;font-size:14px;text-align:left}
.chip:hover{outline:1px solid #444}
.chip i{display:block;font-style:normal;font-size:20px;margin-bottom:6px}
.m{display:flex;gap:12px;padding:14px 0}
.m .av{width:34px;height:34px;flex:none;border-radius:50%;object-fit:contain}
.m .b{min-width:0;overflow-wrap:anywhere}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--user);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%}
.b pre{background:#0a0a0a;border:1px solid var(--bd);color:#e6e6ef;padding:12px;border-radius:12px;overflow-x:auto;font-size:13px}
.b code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--card);padding:1px 5px;border-radius:5px;font-size:.9em}
.b pre code{background:none;padding:0}
.dots span{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:var(--ac);animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-6px);opacity:.4}}
#bar{padding:8px 16px 14px}
#box{border:1px solid var(--bd);max-width:760px;margin:0 auto;background:var(--card);border-radius:28px;padding:12px 12px 8px 20px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
#box:focus-within{border-color:#444;box-shadow:none}
textarea{width:100%;border:0;outline:0;background:none;color:var(--tx);font:inherit;resize:none;max-height:160px;padding:8px 0}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:none;font-size:18px;flex:none}
#send{width:44px;height:44px;background:#fff;color:#000;display:grid;place-items:center;transition:transform .15s}#send:not(:disabled):hover{transform:scale(1.08)}#send:not(:disabled):active{transform:scale(.94)}#send svg{width:20px;height:20px}
#send:disabled{opacity:1;background:#1a1a1a;box-shadow:none;color:#555}
.rb.rec{background:#fff;color:#000}
.row{display:flex;align-items:center;gap:6px}.row .sp{flex:1}.rb svg{width:22px;height:22px}.rb:hover{background:var(--bd)}#send:hover{background:#fff}#send:disabled:hover{background:#1a1a1a}
#box{position:relative}
#att{display:flex;gap:8px;flex-wrap:wrap}#att:empty{display:none}
.at{position:relative;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px 26px 6px 8px;font-size:13px;display:flex;gap:8px;align-items:center;max-width:220px;margin-bottom:6px}
.at img{width:36px;height:36px;object-fit:cover;border-radius:8px}.at span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at button{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--mu);font-size:16px}
#menuA{position:absolute;bottom:58px;left:10px;background:#141414;border:1px solid var(--bd);border-radius:16px;padding:6px;display:none;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:6}
#menuA.on{display:block}
#menuA button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:15px;text-align:left}
#menuA button:hover{background:var(--card)}#menuA svg{width:20px;height:20px;color:var(--mu)}
.act{margin-top:4px}.act button{border:0;background:none;color:var(--mu);font-size:13px;padding:2px 0}.act button:hover{color:var(--tx)}
.col{min-width:0}
.b h4{margin:12px 0 4px;font-size:1.05em}.b li{margin-left:20px;list-style:disc}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1a1a1a;border:1px solid var(--bd);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.note{text-align:center;font-size:12px;color:var(--mu);margin-top:8px}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(14px + env(safe-area-inset-top,0px))}#side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}#menu{display:block}.hl{display:block}}
#gate{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.gc{width:min(400px,100%);text-align:center}.gi{width:84px;height:84px;border-radius:50%;}
.gc h2{font-weight:500;font-size:26px;margin:18px 0 6px}.gc p{color:var(--mu);margin:0 0 20px;font-size:14px}
#kin{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;color:var(--tx);font:inherit;outline:0}#kin:focus{border-color:#444}
#kgo{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font-weight:600;color:#000;background:#fff}
#kerr{color:#aaa;font-size:13px;min-height:18px;margin-top:10px}
#ckey{border:1px solid var(--bd);background:none;border-radius:12px;padding:9px;color:var(--mu);font-size:13px}#ckey:hover{color:var(--tx)}
.cb{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:10px 0}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#141414;font-size:12px;color:var(--mu)}
.cs{display:flex;gap:6px}.ch button{border:0;background:#222;color:var(--tx);border-radius:8px;padding:4px 12px;font-size:12px}.ch button:hover{background:#333}
.b .cb pre{margin:0;border:0;border-radius:0;background:none}
.cb iframe{width:100%;height:360px;border:0;background:#fff;display:block}
</style>
</head>
