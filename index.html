<style>
:root{--bg:#f3f1fa;--text:#1b1830;--muted:#79768f;--card:rgba(255,255,255,.75);--line:rgba(120,100,200,.2);--orbmix:multiply;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060f;--text:#efeefb;--muted:#8b88a8;--card:rgba(30,26,52,.7);--line:rgba(160,140,255,.18);--orbmix:lighter}}
:root[data-theme="dark"]{--bg:#07060f;--text:#efeefb;--muted:#8b88a8;--card:rgba(30,26,52,.7);--line:rgba(160,140,255,.18);--orbmix:lighter}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.top{text-align:center;padding:10px 0 0;position:relative}
#orb{width:210px;height:210px;display:block;margin:0 auto}
#state{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-14px}
#msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px;-webkit-mask-image:linear-gradient(transparent,#000 24px);mask-image:linear-gradient(transparent,#000 24px)}
.m{max-width:88%;animation:up .4s ease}
.u{align-self:flex-end;font-size:14px;color:var(--muted);text-align:right}
.u::before{content:"";}
.b{align-self:flex-start;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:14px 18px;font-size:17px;box-shadow:0 0 40px -10px hsl(var(--h,260) 90% 60%/.5)}
.cur::after{content:"▍";animation:bl .8s infinite;color:hsl(var(--h,260) 90% 65%)}
@keyframes bl{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hi{margin:auto;text-align:center;color:var(--muted);padding:10px}
.hi b{display:block;color:var(--text);font-size:22px;margin-bottom:4px}
.bar{padding:8px 14px 14px}
.box{display:flex;align-items:center;gap:6px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;padding:6px;transition:box-shadow .3s}
.box:focus-within{box-shadow:0 0 0 2px hsl(var(--h,260) 90% 65%/.6),0 0 30px hsl(var(--h,260) 90% 60%/.35)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px 10px}
.rb{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;flex:none;background:transparent;color:var(--muted);transition:.2s}
.rb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:#ff4d6d;color:#fff}
#send{background:linear-gradient(135deg,hsl(var(--h,260) 90% 62%),hsl(calc(var(--h,260) + 50) 90% 62%));color:#fff}
#send:disabled{opacity:.35}
body{position:relative;display:flex}
.app{flex:1;min-width:0}
.rail{position:absolute;top:0;bottom:0;left:0;width:min(290px,85%);display:flex;flex-direction:column;gap:8px;padding:14px;border-right:1px solid var(--line);background:var(--bg);transform:translateX(-105%);transition:transform .25s;z-index:5}
.rail.o{transform:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#ov.o{opacity:1;pointer-events:auto}
.rail .rb{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 14px;color:var(--text);font:inherit;font-size:15px;flex:none}
.rail .rb:hover,.rail .rb.act{color:var(--text);border-color:hsl(var(--h,260) 90% 65%)}
.sp{flex:1}
.hb{position:absolute;left:12px;top:12px;border:1px solid var(--line);background:var(--card);z-index:2}
.me{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.me small{display:block;color:var(--muted);font-size:12px}
.av{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:17px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h,260) 90% 62%),hsl(calc(var(--h,260) + 50) 90% 62%))}
#panel{display:none;flex:1;min-height:0;flex-direction:column}
#panel.o{display:flex}
#panel.o + .sp{display:none}
.ph{padding:16px 16px 8px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:8px}
.it{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.it:hover,.it.cur{background:var(--card)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
#prof{position:absolute;left:62px;bottom:14px;display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:16px;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#prof.o{display:flex}
#prof small{display:block;color:var(--muted);font-size:12px}
#wave{height:0;overflow:hidden;transition:height .3s,margin .3s}
#wave.show{height:96px;margin-bottom:8px}
#live{font-size:14px;color:var(--muted);text-align:center;height:24px;line-height:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px}
.bar{position:relative}
.mrow{display:flex;justify-content:flex-end;margin-bottom:6px}
#mb{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
#mm{display:none;position:absolute;right:14px;bottom:100%;width:min(300px,calc(100% - 28px));background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:3}
#mm.o{display:block;min-height:120px}
#ml{max-height:260px;overflow-y:auto}
#ourl{width:100%;flex:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px}
.ne{color:var(--muted);text-align:center;padding:44px 12px;font-size:14px}
.box{position:relative}
#am{display:none;position:absolute;left:0;bottom:calc(100% + 10px);min-width:210px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:3}
#am.o{display:block}
.ai{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;color:var(--text);font-size:15px}
.ai:hover{background:var(--card)}
.ai svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
*{-webkit-tap-highlight-color:transparent}
button,.ai,.it,.mi{outline:none;-webkit-user-select:none;user-select:none}
input:focus,textarea:focus,button:focus,button:focus-visible{outline:none}
#chip{display:none;align-items:center;gap:8px;margin-bottom:8px;padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:13px;width:fit-content;max-width:100%}
#chip.o{display:flex}
#chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip button{border:0;background:none;color:var(--muted);cursor:pointer}
.cp{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:4px 0;margin-top:8px}
.cp svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp.ok{color:hsl(var(--h,260) 90% 65%)}
.b .t{white-space:pre-wrap}
.cb{margin:10px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(120,100,200,.12)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);min-height:34px}
.ch .cp{margin:0}
.cb pre{margin:0;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);white-space:pre}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer}
.mi:hover{background:var(--card)}
.mi b{display:block;font-size:15px}
.mi small{color:var(--muted);font-size:12px}
.mi .ck{margin-left:auto;color:hsl(var(--h,260) 90% 65%);opacity:0}
.mi.sel .ck{opacity:1}
.mi{color:var(--text)}
.mi div{min-width:0}
.mh{padding:8px 12px 4px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#wv{width:100%;height:68px;display:block;border-radius:20px;background:var(--card);border:1px solid var(--line)}
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth.h{display:none}
.ac{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 60px -15px hsl(var(--h,260) 90% 60%/.5)}
.ac h2{text-align:center;font-size:26px}
.ac p{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
.at{display:flex;gap:6px;background:rgba(120,100,200,.12);border-radius:99px;padding:4px}
.at button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px;border-radius:99px;cursor:pointer}
.at button.act{background:var(--bg);color:var(--text)}
.ac input{flex:none;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
#aerr{color:#ff4d6d;font-size:13px;min-height:18px;text-align:center}
#adone{border:0;border-radius:14px;padding:12px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,hsl(var(--h,260) 90% 62%),hsl(calc(var(--h,260) + 50) 90% 62%))}
#adone:disabled{opacity:.5}
</style>
</head>

function frame(){
 t+=0.012*spd;
 var tA=mode=='think'?20:mode=='listen'?24:mode=='talk'?14:8,tS=mode=='think'?3:mode=='listen'?1.8:mode=='talk'?1.6:1;
 amp+=(tA-amp)*.05;spd+=(tS-spd)*.05;hue+=(tH-hue)*.04;
 document.documentElement.style.setProperty('--h',Math.round(hue));
 var W=420,c=W/2,dark=getComputedStyle(document.documentElement).getPropertyValue('--orbmix').trim()=='lighter';
 cx.clearRect(0,0,W,W);cx.globalCompositeOperation=dark?'lighter':'source-over';
 for(var L=0;L<4;L++){
  cx.beginPath();
  for(var i=0;i<=120;i++){
   var a=i/120*Math.PI*2,k=3+L,r=110+Math.sin(a*k+t*(1+L*.4)+L)*amp+Math.sin(a*2-t*1.3)*amp*.5;
   var x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;i?cx.lineTo(x,y):cx.moveTo(x,y);
  }
  cx.closePath();
  var g=cx.createRadialGradient(c,c,10,c,c,150);
  var h=hue+L*28;
  g.addColorStop(0,'hsla('+h+',95%,70%,'+(dark?.55:.5)+')');
  g.addColorStop(1,'hsla('+(h+40)+',95%,55%,'+(dark?.08:.12)+')');
  cx.fillStyle=g;cx.fill();
  cx.lineWidth=2;cx.strokeStyle='hsla('+h+',95%,75%,.5)';cx.stroke();
 }
 requestAnimationFrame(frame);
}

 var l=$('ml'),none='<div class="ne">Nothing here yet.</div>';

  var arr=Array.isArray(j)?j:(j.data||j.models||[]);

function clean(s){return s.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').replace(/^\s+/,'')}
function prepAtt(pp){
 return new Promise(function(ok){
  if(!pp||!pp.file)return ok(null);
  var f=pp.file;
  if(pp.k=='img'){
   var im=new Image();
   im.onload=function(){var m=1024,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({img:c.toDataURL('image/jpeg',.82)})};
   im.onerror=function(){ok(null)};
   im.src=URL.createObjectURL(f);
  }else{
   var r=new FileReader();
   r.onload=function(){ok({text:'\n\n[File: '+f.name+']\n'+String(r.result).slice(0,20000)})};
   r.onerror=function(){ok(null)};
   r.readAsText(f);
  }
 });
}
function askAI(cc,q,pp){
 var hist=[{role:'system',content:'Always reply in English.'}].concat(cc.m.map(function(x){return {role:x.r=='u'?'user':'assistant',content:x.t}}));
 var b=document.createElement('div');b.className='m b cur';b.textContent='\u2026';msgs.appendChild(b);scroll();
 function run(){
 var txt='',raw='';
 try{fetch(POL.url+'/v1/chat/completions',{method:'POST',headers:hdr(),body:JSON.stringify({model:POL.model,messages:hist,stream:true})})
 .then(function(r){
  if(!r.ok)return r.text().then(function(t){var er=new Error(t);er.status=r.status;throw er});
  var rd=r.body.getReader(),dec=new TextDecoder(),buf='';setMode('talk','speaking');
  function pump(){return rd.read().then(function(x){
   if(x.done)return;
   var ch=dec.decode(x.value,{stream:true});raw+=ch;buf+=ch;var ls=buf.split('\n');buf=ls.pop();
   ls.forEach(function(l){l=l.trim();if(l.indexOf('data:')!=0)return;var d=l.slice(5).trim();if(d=='[DONE]')return;try{var j=JSON.parse(d),c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)txt+=c}catch(e){}});
   renderBot(b,clean(txt),true);scroll();return pump()})}
  return pump()})
 .then(function(){
  if(!txt){try{txt=JSON.parse(raw).choices[0].message.content||''}catch(e){}}
  var f=clean(txt)||'(no response)';renderBot(b,f);cc.m.push({r:'b',t:f});sv();setMode('idle','listening')})
 .catch(function(e){fail(b,e)})}catch(e){fail(b,e)}
 }
 prepAtt(pp).then(function(p){
  if(p){var t=(q=='Photo'?'Describe this photo.':q)+(p.text||''),c=[{type:'text',text:t}];if(p.img)c.push({type:'image_url',image_url:{url:p.img}});hist[hist.length-1]={role:'user',content:c}}
  run();
 });
}

}

var wv=$('wv'),wx=wv.getContext('2d'),ms=null,ac=null,an=null,wOn=false,fake=0,lv=[];
function startWave(){if(wOn)return;

function drawW(){
 if(!wOn)return;
 var W=wv.width,H=wv.height,n=51,bw=W/n,d=an?new Uint8Array(an.frequencyBinCount):null;
 if(an)an.getByteFrequencyData(d);

 for(var i=0;i<n;i++){
  var j=Math.abs(i-(n-1)/2)/((n-1)/2);
  var v;if(d)v=Math.min(1,d[Math.floor(j*d.length*.6)]/255*1.4);else{lv[i]=(lv[i]||.1)+((Math.random()*(1-j*.6))-(lv[i]||.1))*.2;v=lv[i]}
  var h=Math.max(6,v*H*.95);
  wx.fillStyle='hsl('+Math.round(hue+i*3)+',90%,65%)';

  if(wx.roundRect)wx.roundRect(i*bw+bw*.2,(H-h)/2,bw*.6,h,bw*.3);else wx.rect(i*bw+bw*.2,(H-h)/2,bw*.6,h);
  wx.fill();
 }

}

function fh(s){var a=0xdeadbeef,b=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(16)}

   USERS[k]={n:u,s:salt,h:h};saveU();enter(u);
  });
 }else{
  var r=USERS[k];
  if(!r){aerr('Wrong username or password.');return}
  hashPw(p,r.s,r.h.indexOf('f:')==0).then(function(h){
   if(h!==r.h){aerr('Wrong username or password.');return}
   enter(r.n);
  });
 }
