<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #18181c;
            border: 1px solid #2b2b32;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        h2 {
            margin-bottom: 6px;
            color: #007aff;
            font-size: 22px;
        }
        p {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 22px;
        }
        .key-box {
            background: #09090b;
            border: 1px dashed #3a3a44;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #00ff88;
            word-break: break-all;
            margin-bottom: 20px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-generate {
            background: #007aff;
            color: #ffffff;
        }
        .btn-generate:hover {
            background: #0056b3;
        }
        .btn-copy {
            background: #2c2c35;
            color: #ffffff;
        }
        .btn-copy:hover {
            background: #3a3a46;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Militol Key Generator</h2>
        <p>Clicca per generare una nuova chiave casuale</p>
        
        <div class="key-box" id="keyDisplay">Premere "Genera Key"</div>
        
        <div class="btn-group">
            <button class="btn-generate" onclick="generateKey()">Genera Key</button>
            <button class="btn-copy" onclick="copyKey()">Copia</button>
        </div>
    </div>

    <script>
        const PREFIX = "militol_";
        const CHARS = "abcdefghijklmnopqrstuvwxyz0123456789";

        function generateKey() {
            let randomPart = "";
            for (let i = 0; i < 24; i++) {
                randomPart += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
            }
            const fullKey = PREFIX + randomPart;
            document.getElementById("keyDisplay").innerText = fullKey;
        }

        function copyKey() {
            const keyText = document.getElementById("keyDisplay").innerText;
            if (keyText.startsWith(PREFIX)) {
                navigator.clipboard.writeText(keyText);
                alert("Chiave copiata negli appunti!");
            } else {
                alert("Genera prima una chiave!");
            }
        }
    </script>

</body>
</html>
