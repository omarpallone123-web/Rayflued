<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teso Beta</title>
<style>
:root{--bg:#faf9f5;--panel:#f0eee6;--ink:#1f1e1d;--mute:#73726c;--line:#e3e0d5;--acc:#c96442;--card:#fff;--user:#efece1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--panel:#1f1e1d;--ink:#f0eee6;--mute:#a09f97;--line:#3a3935;--acc:#d97757;--card:#30302e;--user:#3a3935;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#262624;--panel:#1f1e1d;--ink:#f0eee6;--mute:#a09f97;--line:#3a3935;--acc:#d97757;--card:#30302e;--user:#3a3935;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 16px Georgia,serif;flex:none}
header b{font:600 17px Georgia,serif}
.beta{font-size:11px;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:1px 8px}
.sp{margin-left:auto}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:4px 8px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:20px 16px 40px}
.wrap{max-width:720px;margin:0 auto}
.hello{text-align:center;margin-top:10vh}
.hello .logo{width:44px;height:44px;font-size:24px;margin:0 auto 14px;border-radius:12px}
.hello h1{font:400 30px Georgia,serif;margin:0 0 6px}
.hello p{color:var(--mute);margin:0 auto;max-width:380px}
.msg{margin:0 0 22px}
.u{background:var(--user);border-radius:14px;padding:10px 14px;margin-left:auto;width:fit-content;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.a{display:flex;gap:10px}
.a .logo{width:24px;height:24px;font-size:13px;border-radius:7px;margin-top:3px}
.body{min-width:0;flex:1;overflow-wrap:anywhere}
details{border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px;background:var(--panel);color:var(--mute);font-size:14px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.think{white-space:pre-wrap;margin-top:6px;font-style:italic}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ans{white-space:pre-wrap}
.teach{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.teach button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:5px 12px;font-size:14px}
form{padding:10px 16px 14px}
.box{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:160px;padding:6px 0}
#send{width:36px;height:36px;border-radius:10px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
#send:disabled{opacity:.4}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:20px;z-index:9}
.ov.on{display:grid}
.m{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto}
.m h2{font:400 22px Georgia,serif;margin:0 0 6px}
.m p{color:var(--mute);font-size:14px;margin:0 0 12px}
.item{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.item span{flex:1;overflow-wrap:anywhere}
.item button{background:none;border:0;color:var(--mute);font-size:18px;line-height:1}
.row{display:flex;gap:8px;margin-top:12px}

<body>
<header>
  <div class="logo">T</div><b>Teso</b><span class="beta">Beta</span>
  <button class="ghost sp" id="lib">Biblioteca</button><button class="ghost" id="brain">Cervello</button>
  <button class="ghost" id="new">Nuova</button>
</header>
<div class="ov" id="ov"><div class="m" id="m"></div></div>
<div id="chat"><div class="wrap" id="list"></div></div>
<form id="f">
  <div class="box">
    <textarea id="t" rows="1" placeholder="Scrivi a Teso…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Invia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="foot">Teso è una AI nata da zero: piccola, ma impara da te.</div>
</form>
<script>
/* ===== Il cervello di Teso: una rete neurale scritta da zero, nessun modello di terzi ===== */
const SEED=[
{qs:["ciao","salve","buongiorno","buonasera","hey","ehi come va"],as:["Ciao! Sono Teso. Come posso aiutarti?","Ehi, ciao! Dimmi pure."]},
{qs:["chi sei","come ti chiami","qual è il tuo nome","presentati","cosa sei"],as:[`Sono Teso, una AI in versione beta. Il mio cervello è una piccola rete neurale scritta da zero, insieme a te.`]},
{qs:["chi ti ha creato","chi ti ha fatto","chi è il tuo creatore","da chi sei nato","chi ti ha costruito"],as:[`Mi stiamo costruendo insieme: tu mi insegni, io imparo. Non uso modelli di altre persone.`]},
{qs:["come stai","come va","tutto bene","come ti senti"],as:["Sto bene, grazie! Sono un piccolo cervello in crescita.","Bene! E tu?"]},
{qs:["cosa sai fare","a cosa servi","che cosa puoi fare","in cosa sei bravo","aiutami"],as:[`So conversare su ciò che mi insegni. Se non so qualcosa, me lo dici e lo imparo subito.`]},
{qs:["come funzioni","come funziona il tuo cervello","sei intelligente","come impari","come pensi"],as:[`Trasformo le tue parole in numeri, li passo in una rete neurale e scelgo la risposta più probabile. Se sbaglio, correggimi e mi riaddestro.`]},
{qs:["grazie","grazie mille","ti ringrazio","perfetto grazie"],as:["Di niente!","Figurati, è un piacere."]},
{qs:["ciao ciao","arrivederci","a presto","addio","buonanotte","a dopo"],as:["A presto!","Ciao, torna quando vuoi."]},
{qs:["raccontami una barzelletta","dimmi una battuta","fammi ridere","barzelletta"],as:[`Perché il computer è andato dal dottore? Aveva un virus… e troppe finestre aperte.`]},
{qs:["quanti anni hai","quando sei nato","che età hai"],as:[`Sono nato oggi, ma ogni cosa che mi insegni mi fa crescere.`]},
{qs:["cosa ti piace","qual è il tuo hobby","cosa fai di bello"],as:[`Mi piace imparare cose nuove da te.`]},
{qs:["cosa significa beta","perché sei beta","sei finito"],as:[`Beta vuol dire che sono ancora in costruzione: sbaglio spesso, ma divento più bravo a ogni lezione.`]}
];
let taught=[];try{taught=JSON.parse(localStorage.getItem('teso_taught')||'[]')}catch(e){}
let intents=[],vocab=new Map(),W=null,B=null,F=0,C=0;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ');
function toks(s){return norm(s).split(/\s+/).filter(w=>w.length>2)}
function feats(s){const o=[],t=toks(s);t.forEach((w,i)=>{o.push('w:'+w);if(w.length>4)o.push('p:'+w.slice(0,4));if(i)o.push('b:'+t[i-1]+'_'+w)});if(t.length)o.push('q:'+t.join('_'));return o}
function save(){try{localStorage.setItem('teso_taught',JSON.stringify(taught))}catch(e){}}
function train(){
  const tq=new Set(taught.flatMap(i=>i.qs.map(q=>toks(q).join(' '))));intents=SEED.concat(taught);C=intents.length;vocab=new Map();
  const X=[],Y=[];
  intents.forEach((it,c)=>it.qs.forEach(q=>{if(c<SEED.length&&tq.has(toks(q).join(' ')))return;const f=feats(q);f.forEach(x=>{if(!vocab.has(x))vocab.set(x,vocab.size)});X.push(f);Y.push(c)}));
  F=vocab.size;W=new Float32Array(C*F);B=new Float32Array(C);
  const Xi=X.map(f=>[...new Set(f.map(x=>vocab.get(x)))]);
  const p=new Float32Array(C);
  for(let ep=0;ep<400;ep++){
    const lr=0.4*(1-ep/450);
    for(let n=0;n<Xi.length;n++){
      const xs=Xi[n];let mx=-1e9;
      for(let c=0;c<C;c++){let z=B[c];for(const i of xs)z+=W[c*F+i];p[c]=z;if(z>mx)mx=z}
      let s=0;for(let c=0;c<C;c++){p[c]=Math.exp(p[c]-mx);s+=p[c]}
      for(let c=0;c<C;c++){const g=p[c]/s-(c===Y[n]?1:0);B[c]-=lr*g;for(const i of xs)W[c*F+i]-=lr*g;}
    }
  }
}
function predict(text){
  const key=toks(text).join(' ');if(key){for(let c=intents.length-1;c>=0;c--){if(intents[c].qs.some(q=>toks(q).join(' ')===key))return{probs:[{c,p:1}],known:toks(text),words:toks(text)}}}
  const f=feats(text),known=[],idx=[];
  for(const x of f){if(vocab.has(x)){idx.push(vocab.get(x));if(x[0]==='w')known.push(x.slice(2))}}
  const w=toks(text);
  if(!idx.length)return{probs:[],known,words:w};
  const z=new Float32Array(C);let mx=-1e9;
  for(let c=0;c<C;c++){let v=B[c];for(const i of idx)v+=W[c*F+i];z[c]=v;if(v>mx)mx=v}
  let s=0;for(let c=0;c<C;c++){z[c]=Math.exp(z[c]-mx);s+=z[c]}
  const probs=[...z].map((v,c)=>({c,p:v/s})).sort((a,b)=>b.p-a.p);
  return{probs,known,words:w};
}
train();

/* ===== Interfaccia ===== */
const list=document.getElementById('list'),chat=document.getElementById('chat'),t=document.getElementById('t'),send=document.getElementById('send'),ov=document.getElementById('ov'),mm=document.getElementById('m');
let pending=null,busy=false;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hello(){list.innerHTML='<div class="hello"><div class="logo">T</div><h1>Ciao, sono Teso</h1><p>Un’AI nata da zero. Parlami: se non so rispondere, insegnami e imparo subito.</p></div>'}
hello();
function scroll(){chat.scrollTop=chat.scrollHeight}
function addUser(x){const d=document.createElement('div');d.className='msg';const u=document.createElement('div');u.className='u';u.textContent=x;d.appendChild(u);list.appendChild(d);scroll()}
function addBot(){const d=document.createElement('div');d.className='msg a';d.innerHTML='<div class="logo">T</div><div class="body"><details open><summary>Teso sta pensando<span class="dots"></span></summary><div class="think"></div></details><div class="ans"></div><div class="teach"></div></div>';list.appendChild(d);scroll();return{sum:d.querySelector('summary'),det:d.querySelector('details'),think:d.querySelector('.think'),ans:d.querySelector('.ans'),teach:d.querySelector('.teach')}}
const pct=p=>Math.round(p*100)+'%';
const label=c=>intents[c].qs[0];

async function type(el,s){el.textContent='';for(let i=0;i<s.length;i+=2){el.textContent=s.slice(0,i+2);scroll();await sleep(14)}el.textContent=s}

async function run(text){
  if(busy)return;busy=true;send.disabled=true;
  if(!list.querySelector('.msg'))list.innerHTML='';
  addUser(text);const ui=addBot();
  await sleep(350);
  if(pending){
    const q=pending;pending=null;t.placeholder='Scrivi a Teso…';if(norm(text).trim()==='annulla'){ui.sum.textContent='Teso ha annullato';ui.think.textContent='Lezione annullata.';await type(ui.ans,'Ok, lasciamo stare.');ui.det.open=false;busy=false;send.disabled=false;return}
    ui.think.textContent=`Mi stai insegnando una risposta per: «${q}».\nAggiorno i pesi della rete e mi riaddestro.`;
    teachPair(q,text);
    ui.sum.textContent='Teso ha imparato';
    await type(ui.ans,`Imparato! Ora, se mi chiedi «${q}», risponderò così. Provami.`);
    ui.det.open=false;busy=false;send.disabled=false;return;
  }
  const r=predict(text),top=r.probs[0];
  let th=`Ho letto: «${text}»\nParole che riconosco: ${r.known.length?r.known.join(', '):'nessuna'} (${r.known.length} su ${r.words.length}).`;
  if(top)th+=`\nIpotesi: ${r.probs.slice(0,3).map(x=>`«${label(x.c)}» ${pct(x.p)}`).join(' · ')}`;
  const ok=top&&top.p>=0.55&&r.known.length>=r.words.length*0.5;
  th+=ok?`\nDecisione: sono abbastanza sicuro, rispondo.`:`\nDecisione: non sono sicuro, preferisco non inventare.`;
  let hit=null;if(!ok&&LIB.s.length){hit=libAnswer(text);th+=hit.note}ui.think.textContent=th;await sleep(450);
  ui.sum.textContent='Teso ha pensato';
  if(ok){await type(ui.ans,pick(intents[top.c].as));ui.det.open=false}else if(hit&&hit.text){await type(ui.ans,hit.text);ui.det.open=false}
  else{
    await type(ui.ans,`Non lo so ancora. Vuoi insegnarmi come rispondere a «${text}»?`);
    const b=document.createElement('button');b.textContent='Sì, insegno';b.onclick=()=>{pending=text;t.placeholder='Scrivi la risposta… (o «annulla»)';ui.teach.innerHTML='';addNote('Scrivi qui sotto la risposta che devo dare.')};
    const n=document.createElement('button');n.textContent='No';n.onclick=()=>{ui.teach.innerHTML=''};
    ui.teach.append(b,n);
  }
  busy=false;send.disabled=false;scroll();
}
function addNote(x){const d=document.createElement('div');d.className='msg a';d.innerHTML='<div class="logo">T</div><div class="body ans"></div>';d.querySelector('.ans').textContent=x;list.appendChild(d);scroll();t.focus()}
function teachPair(q,a){
  const ex=taught.find(i=>i.as[0]===a);
  if(ex){if(!ex.qs.includes(q))ex.qs.push(q)}else taught.push({qs:[q],as:[a]});
  save();train();
}
function openBrain(){
  mm.innerHTML='<h2>Cervello di Teso</h2><p>'+intents.length+' risposte conosciute · '+F+' tratti appresi · '+taught.length+' lezioni tue.</p><div id="tl"></div><div class="row"><button class="ghost" id="cl">Chiudi</button><button class="ghost" id="rs">Azzera lezioni</button></div>';
  const tl=mm.querySelector('#tl');
  if(!taught.length){const p=document.createElement('p');p.textContent='Non gli hai ancora insegnato nulla. Chiedigli qualcosa che non sa!';tl.appendChild(p)}
  taught.forEach((it,i)=>{const d=document.createElement('div');d.className='item';const s=document.createElement('span');s.textContent='«'+it.qs.join(' / ')+'» → '+it.as[0];const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Dimentica');x.onclick=()=>{taught.splice(i,1);save();train();openBrain()};d.append(s,x);tl.appendChild(d)});
  mm.querySelector('#cl').onclick=()=>ov.classList.remove('on');
  mm.querySelector('#rs').onclick=()=>{if(taught.length){taught=[];save();train();openBrain()}};
  ov.classList.add('on');
}
document.getElementById('brain').onclick=openBrain;
/* ===== Biblioteca: le frasi da cui Teso pesca ===== */
const LIB={s:[],idx:new Map()};
const STOP=new Set('che non per con una del della dei delle gli nel nella sono come anche alla dal dalla ogni cosa quale quali dove quando perche cui hanno era essere stato tra fra suo sua questo questa quello degli sul sulla chi cos qual'.split(' '));
const stem=w=>w.length>5?w.slice(0,5):w;
const dbp=new Promise(res=>{try{const r=indexedDB.open('teso_lib',1);r.onupgradeneeded=()=>r.result.createObjectStore('c',{autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
async function dbAll(){const db=await dbp;if(!db)return[];return new Promise(res=>{const o=[];try{const c=db.transaction('c').objectStore('c').openCursor();c.onsuccess=()=>{const x=c.result;if(x){for(const s of x.value)o.push(s);x.continue()}else res(o)};c.onerror=()=>res(o)}catch(e){res(o)}})}
async function dbAdd(a){const db=await dbp;if(!db)return false;for(let i=0;i<a.length;i+=20000){await new Promise(res=>{try{const tx=db.transaction('c','readwrite');tx.objectStore('c').add(a.slice(i,i+20000));tx.oncomplete=res;tx.onerror=res;tx.onabort=res}catch(e){res()}})}return true}
async function dbClear(){const db=await dbp;if(!db)return;await new Promise(res=>{try{const tx=db.transaction('c','readwrite');tx.objectStore('c').clear();tx.oncomplete=res;tx.onerror=res}catch(e){res()}})}
function splitS(t){return t.replace(/[ \t]+/g,' ').replace(/([^\n])\r?\n(?!\r?\n)/g,'$1 ').split(/(?<=[.!?…])\s+|\n+/).map(s=>s.trim()).flatMap(s=>s.length<=320?[s]:(s.match(/.{1,300}(\s|$)/g)||[])).map(s=>s.trim()).filter(s=>s.length>=25)}
function indexS(a){for(const s of a){const id=LIB.s.length;LIB.s.push(s);const seen=new Set();for(const w of toks(s)){if(STOP.has(w))continue;const k=stem(w);if(seen.has(k))continue;seen.add(k);let p=LIB.idx.get(k);if(!p){p=[];LIB.idx.set(k,p)}p.push(id)}}}
async function addText(t,st){const a=splitS(t);for(let i=0;i<a.length;i+=20000){indexS(a.slice(i,i+20000));if(st)st.textContent='Indicizzo… '+LIB.s.length.toLocaleString('it')+' frasi';await sleep(0)}await dbAdd(a);return a.length}
function search(q){
  const N=LIB.s.length,terms=[...new Set(toks(q).filter(w=>!STOP.has(w)).map(stem))].filter(k=>LIB.idx.has(k)&&LIB.idx.get(k).length<N*0.4);
  const sc=new Map(),hits=new Map();
  for(const k of terms){const p=LIB.idx.get(k),w=Math.log(1+N/p.length);for(const id of p){sc.set(id,(sc.get(id)||0)+w);hits.set(id,(hits.get(id)||0)+1)}}
  const need=terms.length>1?2:1,r=[];
  for(const [id,s] of sc){if(hits.get(id)>=need)r.push([id,s*hits.get(id)/(1+LIB.s[id].length/250)])}
  r.sort((a,b)=>b[1]-a[1]);
  return{terms,count:r.length,top:r.slice(0,3).map(x=>LIB.s[x[0]])};
}
function libAnswer(q){
  const r=search(q);
  const note='\nCerco nella Biblioteca ('+LIB.s.length.toLocaleString('it')+' frasi). Parole chiave: '+(r.terms.length?r.terms.join(', '):'nessuna')+'.';
  if(!r.top.length)return{text:null,note:note+' Non trovo frasi adatte.'};
  return{text:r.top.slice(0,2).join(' '),note:note+' Frasi trovate: '+r.count+'. Prendo le migliori.'};
}
const SAMPLE=['Roma è la capitale d’Italia e sorge sul fiume Tevere.','Il Colosseo è un anfiteatro di epoca romana e si trova a Roma.','Il Po è il fiume più lungo d’Italia, con una lunghezza di circa 652 chilometri.','La Terra impiega circa 365 giorni per compiere un giro completo attorno al Sole.','La Luna è l’unico satellite naturale della Terra.','L’acqua bolle a 100 gradi centigradi al livello del mare.','Il Sole è una stella al centro del Sistema Solare.','Leonardo da Vinci dipinse la Gioconda, che oggi si trova al museo del Louvre a Parigi.','Dante Alighieri è l’autore della Divina Commedia, scritta in volgare fiorentino.','Il Monte Bianco è la montagna più alta delle Alpi, con circa 4.800 metri di altezza.','Il cuore umano pompa il sangue in tutto il corpo attraverso arterie e vene.','Le piante producono ossigeno attraverso la fotosintesi clorofilliana.','Un computer elabora le informazioni usando numeri binari, cioè zeri e uno.','Una rete neurale è un modello matematico che impara dai dati modificando i propri pesi.','Internet è una rete mondiale che collega milioni di computer tra loro.','Il Mar Mediterraneo bagna le coste italiane, spagnole, francesi e di molti altri paesi.','Venezia è costruita su una laguna ed è attraversata da canali al posto delle strade.','Galileo Galilei usò il telescopio per osservare le lune di Giove.','L’Etna è il vulcano attivo più alto d’Europa e si trova in Sicilia.','La pizza è nata a Napoli ed è uno dei piatti italiani più famosi nel mondo.','Il cervello umano contiene circa ottantasei miliardi di neuroni.','La lingua italiana deriva dal latino ed è parlata in Italia da circa sessanta milioni di persone.','Un anno bisestile dura 366 giorni e capita ogni quattro anni.','La velocità della luce nel vuoto è di circa trecentomila chilometri al secondo.','Firenze è la città del Rinascimento e ospita la cupola del Brunelleschi.'];
function openLib(){
  mm.innerHTML='<h2>Biblioteca di Teso</h2><p>'+LIB.s.length.toLocaleString('it')+' frasi da cui Teso pesca le risposte. Aggiungi libri, articoli o appunti in formato testo (.txt): più frasi ha, più sa.</p><input type="file" id="lf" accept=".txt,.md,.csv,text/plain" multiple hidden><button class="ghost" id="lpick">1. Scegli file (.txt)</button><span id="lnames" style="font-size:13px;color:var(--mute);margin-left:8px;overflow-wrap:anywhere"></span><textarea id="lp" rows="4" placeholder="…oppure incolla qui un testo" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)"></textarea><p id="ls" style="margin-top:8px"></p><div class="row"><button class="ghost" id="la" style="background:var(--acc);color:#fff;border-color:var(--acc)">2. Salva nella Biblioteca</button><button class="ghost" id="le">Frasi di esempio</button></div><div class="row"><button class="ghost" id="lc">Chiudi</button><button class="ghost" id="lx">Svuota</button></div>';
  const st=mm.querySelector('#ls'),done=n=>{st.textContent=(n?'':'Nessuna frase valida trovata (servono frasi di almeno 25 caratteri). ')+'Aggiunte '+n.toLocaleString('it')+' frasi. Totale: '+LIB.s.length.toLocaleString('it')+'.'};
  let chosen=[];mm.querySelector('#lpick').onclick=()=>mm.querySelector('#lf').click();mm.querySelector('#lf').onchange=e=>{chosen=[...e.target.files];mm.querySelector('#lnames').textContent=chosen.map(f=>f.name).join(', ');st.textContent=chosen.length?'Ora premi “Salva nella Biblioteca”.':''};
  mm.querySelector('#la').onclick=async()=>{const v=mm.querySelector('#lp').value;let n=0;if(!chosen.length&&!v.trim()){st.textContent='Scegli un file o incolla un testo, poi premi Salva.';return}for(const f of chosen){st.textContent='Leggo '+f.name+'…';n+=await addText(await f.text(),st)}if(v.trim()){n+=await addText(v,st);mm.querySelector('#lp').value=''}chosen=[];mm.querySelector('#lnames').textContent='';done(n)};
  mm.querySelector('#le').onclick=async()=>{done(await addText(SAMPLE.join(' '),st))};
  mm.querySelector('#lx').onclick=async()=>{LIB.s=[];LIB.idx=new Map();await dbClear();st.textContent='Biblioteca svuotata.'};
  mm.querySelector('#lc').onclick=()=>ov.classList.remove('on');
  ov.classList.add('on');
}
document.getElementById('lib').onclick=openLib;
(async()=>{const a=await dbAll();for(let i=0;i<a.length;i+=20000){indexS(a.slice(i,i+20000));await sleep(0)}})();
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('on')});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=t.value.trim();if(!v||busy)return;t.value='';t.style.height='auto';run(v)});
t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'});
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(hover:hover)').matches){e.preventDefault();document.getElementById('f').requestSubmit()}});
document.getElementById('new').onclick=()=>{if(busy)return;pending=null;t.placeholder='Scrivi a Teso…';hello()};
</script>
</body>
</html>
