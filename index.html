:root[data-t=light]{--bg:#faf9f5;--side:#f0eee6;--card:#fff;--bd:#e0ddd0;--tx:#1f1e1d;--mu:#6b6a63;--user:#f0eee6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:Georgia,"Times New Roman",serif}
#side{width:270px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;transition:transform .25s;z-index:20}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-size:20px}
.logo{width:28px;height:28px;color:var(--ac)}
.nb{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;color:var(--ac2);font-weight:600;width:100%}
.nb:hover,.ch:hover{background:var(--card)}
.lbl{font-size:12px;color:var(--mu);padding:14px 10px 6px}
#list{flex:1;overflow:auto}
.ch{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;width:100%;text-align:left;gap:6px}
.ch span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch.on{background:var(--card)}
.ch i{font-style:normal;color:var(--mu);opacity:0}
.ch:hover i{opacity:1}
.sb{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--mu);width:100%}
.sb:hover{background:var(--card);color:var(--tx)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:10px;padding:10px 14px}
#menu{display:none;padding:6px;border-radius:8px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:6px 8px;font:14px system-ui;max-width:60vw}
#msgs{flex:1;overflow:auto;padding:10px 16px 20px}
.w{max-width:740px;margin:0 auto}
#hello{text-align:center;margin-top:14vh}
#hello .logo{width:44px;height:44px}
#hello h1{font:400 clamp(28px,5vw,40px)/1.2 Georgia,serif;margin-top:14px}
#hello p{color:var(--mu);margin-top:8px}
.m{margin:22px 0;display:flex;gap:12px}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--user);border:1px solid var(--bd);padding:10px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.m.a .av{flex:none;width:26px;height:26px;color:var(--ac);margin-top:2px}
.m.a .b{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.7;min-width:0;flex:1;word-break:break-word}
.b p{margin:0 0 12px}.b ul,.b ol{margin:0 0 12px 22px}.b h1,.b h2,.b h3{font-family:Georgia,serif;margin:16px 0 8px}
.b code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--card);padding:2px 6px;border-radius:6px}
.pre{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:0 0 12px;overflow:hidden}
.pre .h{display:flex;justify-content:space-between;padding:6px 12px;font:12px system-ui;color:var(--mu);border-bottom:1px solid var(--bd)}
.pre pre{padding:12px;overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.pre code{background:none;padding:0}
.act{display:flex;gap:4px;margin-top:4px}
.act button{color:var(--mu);font:13px system-ui;padding:4px 8px;border-radius:7px}
.act button:hover{background:var(--card);color:var(--tx)}
.cur::after{content:"";display:inline-block;width:8px;height:18px;background:var(--ac);vertical-align:-3px;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.err{color:var(--ac2);font:14px system-ui}
#comp{padding:0 14px calc(14px + env(safe-area-inset-bottom,0px))}
#box{max-width:740px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:10px 10px 8px 16px;box-shadow:0 2px 14px #0003}
#box:focus-within{border-color:var(--ac)}
textarea{width:100%;background:none;border:0;outline:0;resize:none;color:var(--tx);font:16px/1.5 system-ui;max-height:200px;padding:4px 0}
.row{display:flex;justify-content:space-between;align-items:center}
.r,.l{display:flex;gap:6px;align-items:center}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.ib:hover{background:var(--bd);color:var(--tx)}
.ib.rec{background:var(--ac);color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
#prev{display:flex;gap:8px;flex-wrap:wrap}
#prev:not(:empty){padding-bottom:8px}
.th{position:relative}
.th img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px}
.ig{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ig img{max-width:160px;max-height:160px;border-radius:12px}
#send{background:var(--ac);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
#send:disabled{opacity:.4;cursor:default}
.fn{text-align:center;color:var(--mu);font-size:12px;margin-top:8px}
#gate{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:20px}
#gate.on{display:grid}
.dlg{background:var(--side);border:1px solid var(--bd);border-radius:20px;padding:26px;max-width:420px;width:100%}
.dlg h2{font:400 26px Georgia,serif;margin:10px 0 6px}
.dlg p{color:var(--mu);font-size:14px;margin-bottom:14px}
.dlg input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:11px 12px;color:var(--tx);font:15px ui-monospace,monospace;outline:0;margin-bottom:12px}
.dlg input:focus{border-color:var(--ac)}
.pb{background:var(--ac);color:#fff;width:100%;padding:11px;border-radius:11px;font-weight:600}
.pb:hover{background:var(--ac2)}
.dlg a{color:var(--ac2)}
.sg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.sg button{border:1px solid var(--bd);padding:8px 14px;border-radius:999px;font-size:14px;color:var(--mu)}
.sg button:hover{background:var(--card);color:var(--tx)}
#ov{display:none;position:fixed;inset:0;background:#0007;z-index:15}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:calc(14px + env(safe-area-inset-top,0px))}#side.on{transform:none}#ov.on{display:block}#menu{display:block}}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function inl(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--ac2)">$1</a>')}
function md(t){
  const parts=t.split(/```/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');const lang=nl>-1?p.slice(0,nl).trim():'';const code=nl>-1?p.slice(nl+1):p;
      out+=`<div class="pre"><div class="h"><span>${esc(lang||'codice')}</span><button onclick="cp(this)">Copia</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`;return}
    let ul=null;
    p.split('\n').forEach(l=>{
      let m;
      if(m=l.match(/^\s*[-*]\s+(.*)/)){if(ul!=='ul'){if(ul)out+=`</${ul}>`;out+='<ul>';ul='ul'}out+=`<li>${inl(m[1])}</li>`;return}
      if(m=l.match(/^\s*\d+\.\s+(.*)/)){if(ul!=='ol'){if(ul)out+=`</${ul}>`;out+='<ol>';ul='ol'}out+=`<li>${inl(m[1])}</li>`;return}
      if(ul){out+=`</${ul}>`;ul=null}
      if(m=l.match(/^(#{1,3})\s+(.*)/)){out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;return}
      if(l.trim())out+=`<p>${inl(l)}</p>`;
    });
    if(ul)out+=`</${ul}>`;
  });
  return out;
}
window.cp=b=>{const c=b.closest('.pre').querySelector('code').innerText;navigator.clipboard&&navigator.clipboard.writeText(c).catch(()=>{});b.textContent='Copiato!';setTimeout(()=>b.textContent='Copia',1500)};

function save(){ST.set('dc_chats',chats.map(c=>({id:c.id,title:c.title,msgs:c.msgs.map(m=>({role:m.role,content:m.content,n:m.imgs?m.imgs.length:(m.n||0)}))})))}
function renderList(){
  const l=$('#list');l.innerHTML='';
  chats.forEach(c=>{const b=document.createElement('button');b.className='ch'+(cur&&cur.id===c.id?' on':'');
    b.innerHTML=`<span>${esc(c.title)}</span><i title="Elimina">✕</i>`;
    b.onclick=e=>{if(e.target.tagName==='I'){chats=chats.filter(x=>x.id!==c.id);save();if(cur&&cur.id===c.id)newChat();else renderList();return}cur=c;draw();closeSide()};
    l.appendChild(b)});
}
function avatar(){return '<svg class="av"><use href="#lg"/></svg>'}
function draw(){
  const w=$('#wrap');w.innerHTML='';renderList();
  if(!cur||!cur.msgs.length){
    w.innerHTML=`<div id="hello"><svg class="logo"><use href="#lg"/></svg><h1>Bentornato, che si fa oggi?</h1><p>Chiedimi qualsiasi cosa.</p><div class="sg">${SUG.map(s=>`<button>${s}</button>`).join('')}</div></div>`;
    w.querySelectorAll('.sg button').forEach(b=>b.onclick=()=>{$('#inp').value=b.textContent;send()});return}
  cur.msgs.forEach((m,i)=>addMsg(m.role,m.content,i,m));
  $('#msgs').scrollTop=1e9;
}
function addMsg(role,text,i,m){
  const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
  if(role==='user'){const b=document.createElement('div');b.className='b';
    if(m&&m.imgs&&m.imgs.length){const g=document.createElement('div');g.className='ig';m.imgs.forEach(u=>{const im=new Image();im.src=u;g.appendChild(im)});b.appendChild(g)}
    else if(m&&m.n){const g=document.createElement('div');g.style.cssText='color:var(--mu);font-size:13px';g.textContent='📷 '+m.n+(m.n>1?' foto':' foto');b.appendChild(g)}
    const sp=document.createElement('span');sp.textContent=text;b.appendChild(sp);d.appendChild(b)}
  else{d.innerHTML=avatar()+`<div class="b"><div class="c">${md(text)}</div><div class="act"><button onclick="copyMsg(${i})">Copia</button><button onclick="regen()">Rigenera</button></div></div>`}
  $('#wrap').appendChild(d);return d;
}
window.copyMsg=i=>{navigator.clipboard&&navigator.clipboard.writeText(cur.msgs[i].content).catch(()=>{})};
window.regen=()=>{if(busy||!cur)return;while(cur.msgs.length&&cur.msgs[cur.msgs.length-1].role==='assistant')cur.msgs.pop();if(!cur.msgs.length)return;draw();run()};
function newChat(){cur=null;draw();closeSide();$('#inp').focus()}
function closeSide(){$('#side').classList.remove('on');$('#ov').classList.remove('on')}

async function run(){
  busy=true;setBtn();
  const d=document.createElement('div');d.className='m a';d.innerHTML=avatar()+'<div class="b"><div class="c cur"></div></div>';
  $('#wrap').appendChild(d);const c=d.querySelector('.c');const sc=$('#msgs');
  let full='';ctrl=new AbortController();
  const hist=cur.msgs.slice(-30),last=hist[hist.length-1];
  const vis=!!(last&&last.role==='user'&&last.imgs&&last.imgs.length);
  const msgs=hist.map((m,i)=>{
    if(vis&&i===hist.length-1)return{role:'user',content:[{type:'text',text:m.content||'Descrivi questa immagine.'},...m.imgs.map(u=>({type:'image_url',image_url:{url:u}}))]};
    return{role:m.role,content:(m.content||'')+(((m.imgs&&m.imgs.length)||m.n)?' [foto allegata]':'')}});
  try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify(vis?{model:VIS,stream:true,messages:[{role:'system',content:SYS},...msgs]}:{model:$('#model').value,stream:true,include_reasoning:false,messages:[{role:'system',content:SYS},...msgs]})});
    if(!r.ok){let e='';try{e=(await r.json()).error.message}catch(x){}
      if(r.status===401){key='';ST.set('dc_key','');openGate('Chiave non valida. Inseriscine un\'altra.')}
      throw new Error(e||('Errore '+r.status))}
    const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});
      const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){if(!l.startsWith('data:'))continue;const p=l.slice(5).trim();if(p==='[DONE]')continue;
        try{const t=JSON.parse(p).choices[0].delta.content;if(t){full+=t;c.innerHTML=md(full);sc.scrollTop=sc.scrollHeight}}catch(x){}}}
  }catch(e){
    if(e.name!=='AbortError'){c.classList.remove('cur');c.innerHTML=md(full)+`<p class="err">⚠ ${esc(e.message||'Errore di rete')}</p>`}
  }
  if(full){cur.msgs.push({role:'assistant',content:full});save()}
  busy=false;ctrl=null;setBtn();draw();
}
function send(){
  if(busy){ctrl&&ctrl.abort();return}
  const t=$('#inp').value.trim();if(!t&&!imgs.length)return;
  if(!key){openGate();return}
  if(!cur){cur={id:Date.now(),title:(t||'Foto').slice(0,40),msgs:[]};chats.unshift(cur)}
  cur.msgs.push({role:'user',content:t,imgs:imgs.slice()});imgs=[];prev();save();
  $('#inp').value='';grow();draw();run();
}
function setBtn(){const b=$('#send');b.textContent=busy?'■':'↑';b.disabled=!busy&&!$('#inp').value.trim()&&!imgs.length}
function grow(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px';setBtn()}
function openGate(msg){$('#kerr').textContent=msg||'';$('#kin').value='';$('#gate').classList.add('on');setTimeout(()=>$('#kin').focus(),50)}
$('#ksave').onclick=()=>{const v=$('#kin').value.trim();if(!/^gsk_[A-Za-z0-9]{20,}$/.test(v)){$('#kerr').textContent='Chiave non valida: deve iniziare con gsk_';return}
  key=v;ST.set('dc_key',v);$('#gate').classList.remove('on');$('#inp').focus()};
$('#kin').onkeydown=e=>{if(e.key==='Enter')$('#ksave').click()};
$('#gate').onclick=e=>{if(e.target.id==='gate'&&key)$('#gate').classList.remove('on')};
$('#keyb').onclick=()=>{closeSide();openGate()};
$('#new').onclick=newChat;
$('#send').onclick=send;
$('#inp').oninput=grow;
$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};
$('#model').onchange=()=>ST.set('dc_model',$('#model').value);
$('#thm').onclick=()=>{const r=document.documentElement;const n=r.dataset.t==='dark'?'light':'dark';r.dataset.t=n;ST.set('dc_theme',n)};
$('#clr').onclick=()=>{if(confirm('Cancellare tutte le chat?')){chats=[];save();newChat()}};
$('#menu').onclick=()=>{$('#side').classList.add('on');$('#ov').classList.add('on')};
$('#ov').onclick=closeSide;
const VIS='meta-llama/llama-4-scout-17b-16e-instruct';
let imgs=[],rec=null,chunks=[],recOn=false;
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=no;im.src=u})}
function prev(){const p=$('#prev');p.innerHTML='';
  imgs.forEach((s,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML='<img src="'+s+'"><button>✕</button>';
    d.querySelector('button').onclick=()=>{imgs.splice(i,1);prev();setBtn()};p.appendChild(d)})}
$('#plus').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of [...e.target.files]){if(imgs.length>=5)break;try{imgs.push(await shrink(f))}catch(x){}}
  e.target.value='';prev();setBtn()};
$('#mic').onclick=async()=>{
  if(recOn){rec.stop();return}
  if(!key){openGate();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());recOn=false;$('#mic').classList.remove('rec');
      const mt=(rec.mimeType||'audio/webm').split(';')[0],blob=new Blob(chunks,{type:mt});
      if(blob.size<1500)return;
      $('#inp').placeholder='Trascrivo il vocale…';
      try{
        const fd=new FormData();fd.append('file',blob,'voce.'+(mt.includes('mp4')?'m4a':mt.includes('ogg')?'ogg':'webm'));
        fd.append('model','whisper-large-v3-turbo');
        const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});
        const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('Errore '+r.status));
        const t=(j.text||'').trim();
        if(t){$('#inp').value=t;grow();if(!busy)send()}
      }catch(e){alert('Vocale: '+e.message)}
      $('#inp').placeholder='Come posso aiutarti oggi?';
    };
    rec.start();recOn=true;$('#mic').classList.add('rec');
  }catch(e){alert('Microfono non disponibile o permesso negato')}
};
draw();setBtn();if(!key)openGate();
</script>
</body>
</html>
