<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Az1Q (TEST)</title>
<style>
:root{--bg:#131314;--sb:#1b1b1c;--sf:#1e1f20;--sf2:#2a2b2d;--tx:#e3e3e3;--mut:#9aa0a6;--ac:#8ab4f8;--ln:#333537;--h2:#444746}
[data-theme=light]{--bg:#fff;--sb:#f0f4f9;--sf:#f0f4f9;--sf2:#e1e8f0;--tx:#1f1f1f;--mut:#5f6368;--ac:#0b57d0;--ln:#dde3ea;--h2:#c4c7c5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Google Sans","Product Sans",Roboto,system-ui,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;display:block}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex-shrink:0;transition:background .15s}
.ib:hover{background:var(--sf2)}
#side{width:292px;background:var(--sb);padding:12px;display:flex;flex-direction:column;gap:6px;transition:margin .25s;flex-shrink:0}
#side.hide{margin-left:-292px}
#nc{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:24px;color:var(--mut);font-size:15px;margin:6px 0}
#nc:hover{background:var(--sf2);color:var(--tx)}
.lbl{font-size:14px;font-weight:500;padding:14px 14px 6px}
#hist{overflow:auto;flex:1}
.h{display:flex;align-items:center;border-radius:20px;padding:0 6px 0 14px;height:42px;cursor:pointer;font-size:14px;gap:8px}
.h:hover,.h.on{background:var(--sf2)}
.h span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.h button{width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:var(--mut)}
.h button svg{width:18px;height:18px}
.h:hover button{display:grid}
.h button:hover{background:var(--bg)}
#th{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:24px;font-size:14px}
#th:hover{background:var(--sf2)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;align-items:center;gap:4px;padding:10px 14px}
#top .nm{font-size:22px;padding:0 6px;font-weight:500}
#top .tg{font-size:12px;color:var(--mut);border:1px solid var(--ln);border-radius:8px;padding:2px 8px;margin-left:4px}
#top .sp{flex:1}
#chat{flex:1;overflow:auto}
.col{max-width:900px;margin:0 auto;padding:0 20px}
#hero{padding-top:9vh}
#hero .hi{display:flex;align-items:center;gap:14px;font-size:clamp(34px,6vw,56px);font-weight:500;letter-spacing:-.5px}
#hero .hi svg{width:clamp(34px,5vw,48px);height:clamp(34px,5vw,48px)}
.gt{background:linear-gradient(90deg,#4285f4,#9b72cb 55%,#d96570);-webkit-background-clip:text;background-clip:text;color:transparent}
#hero h2{font-size:clamp(30px,5.4vw,54px);font-weight:500;color:var(--h2);letter-spacing:-.5px;margin-top:2px}
#chips{display:flex;gap:12px;margin-top:44px;overflow-x:auto;padding-bottom:6px}
.chip{background:var(--sf);border-radius:18px;width:196px;min-height:188px;flex-shrink:0;padding:16px;text-align:left;font-size:15px;line-height:1.4;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s}
.chip:hover{background:var(--sf2)}
.chip i{align-self:flex-end;width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ac)}
.m{margin:22px 0;display:flex;gap:16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--sf2);border-radius:24px;padding:13px 20px;max-width:80%;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.m .lg{width:32px;height:32px;flex-shrink:0;margin-top:2px}
.m .lg svg{width:32px;height:32px}
.m.a .b{flex:1;min-width:0;line-height:1.75;font-size:16.5px}
.note{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13.5px;margin-bottom:12px}
.note svg{width:17px;height:17px}
.fix{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.fix svg{width:18px;height:18px;margin-top:2px;color:var(--ac);flex-shrink:0}
.b h3{font-size:24px;font-weight:500;margin-bottom:8px}
.card{display:flex;gap:18px;align-items:flex-start}
.card img{width:150px;max-width:34%;border-radius:16px;object-fit:cover}
.src{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--sf);padding:9px 16px;border-radius:20px;color:var(--ac);font-size:14px;text-decoration:none}
.src:hover{background:var(--sf2)}
.src svg{width:17px;height:17px}
.acts{display:flex;gap:2px;margin-top:10px;color:var(--mut)}
.acts .ib{width:38px;height:38px;color:var(--mut)}
.acts svg{width:19px;height:19px}
.acts .dn svg{transform:rotate(180deg)}
.th{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:15px}
.th b{font-weight:400;background:linear-gradient(90deg,var(--mut) 30%,var(--tx) 50%,var(--mut) 70%);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200%}}
.spin{animation:rot 1.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bar{padding:6px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#box{max-width:900px;margin:0 auto;background:var(--sf);border-radius:32px;padding:10px 12px 10px 14px;display:flex;align-items:flex-end;gap:2px;transition:background .15s}
#box:focus-within{background:var(--sf2)}
#in{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;resize:none;max-height:160px;padding:11px 8px;line-height:1.45}
#in::placeholder{color:var(--mut)}
#mic.rec{background:#d93025;color:#fff;animation:pl 1.1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 9px #d9302533}}
#send{background:var(--tx);color:var(--bg)}
#send:disabled{opacity:.25;cursor:default}
#send:hover:not(:disabled){background:var(--tx)}
#foot{text-align:center;font-size:12px;color:var(--mut);padding-top:10px}
@media(max-width:760px){#side{position:fixed;z-index:5;height:100%;box-shadow:6px 0 30px #0008}.col{padding:0 14px}.card{flex-direction:column-reverse}.card img{max-width:60%}}
#ai{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:24px;font-size:14px}#ai:hover{background:var(--sf2)}
.tr{margin-bottom:12px;font-size:13.5px;color:var(--mut)}.tr summary{cursor:pointer}.tr ol{padding-left:22px;margin-top:6px;line-height:1.6}
#cf{background:var(--sf);color:var(--tx);border:0;border-radius:24px;padding:22px;width:min(420px,92vw)}#cf::backdrop{background:#0009}
#cf h3{font-weight:500;font-size:22px;margin-bottom:6px}#cf p{font-size:13.5px;color:var(--mut);line-height:1.5;margin-bottom:12px}
#cf select,#cf input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:8px}
#cf .r{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}#cf .r button{padding:10px 18px;border-radius:20px;background:var(--sf2)}#cf .r #cs{background:var(--ac);color:var(--bg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs></svg>
<aside id="side" class="hide">
  <button class="ib" id="x" aria-label="Chiudi menu"></button>
  <button id="nc"></button>
  <div class="lbl">Recenti</div>
  <div id="hist"></div>
  <button id="ai"></button>
  <button id="th"></button>
</aside>
<div id="main">
  <div id="top">
    <button class="ib" id="mn" aria-label="Menu"></button>
    <span class="nm">Az1Q</span><span class="tg">TEST</span>
    <span class="sp"></span>
    <button class="ib" id="nt" aria-label="Nuova chat"></button>
  </div>
  <div id="chat">
    <div class="col" id="hero">
      <div class="hi"><span id="hl"></span><span class="gt">Ciao!</span></div>
      <h2>Da dove iniziamo?</h2>
      <div id="chips"></div>
    </div>
    <div class="col" id="msgs"></div>
  </div>
  <div id="bar">
    <div id="box">
      <textarea id="in" rows="1" placeholder="Chiedi ad Az1Q"></textarea>
      <button class="ib" id="mic" aria-label="Microfono"></button>
      <button class="ib" id="send" aria-label="Invia" disabled></button>
    </div>
    <div id="foot">Az1Q (TEST) cerca su Wikipedia e può sbagliare. Controlla sempre le fonti.</div>
  </div>
</div>
<dialog id="cf"><h3>Cervello Az1Q</h3><p id="cst"></p><div class="r"><button id="cx">Chiudi</button><button id="cc">Azzera memoria</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const PATH={
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
send:'<path d="M12 19V5M5 12l7-7 7 7"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
up:'<path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2l-1.5 7a2 2 0 0 1-2 1.5H7"/>',
refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
book:'<path d="M5 4h13a1 1 0 0 1 1 1v14H6a2 2 0 0 0-2 2V5a1 1 0 0 1 1-1z"/><path d="M8 8h7"/>',
bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
check:'<path d="M5 12l5 5 9-10"/>',
load:'<path d="M12 3a9 9 0 1 0 9 9" />'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${PATH[n]}</svg>`;
const LOGO='<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 46L21 18L32 46M14.6 35H27.4"/><path d="M37 18H54L37 46H54"/></g></svg>';
document.head.insertAdjacentHTML('beforeend','<link rel="icon" href="data:image/svg+xml,'+encodeURIComponent(LOGO.replace('url(#g)','#7b6fe0').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))+'">');
$('#x').innerHTML=ic('menu');$('#mn').innerHTML=ic('menu');$('#nt').innerHTML=ic('edit');
$('#nc').innerHTML=ic('edit')+'<span>Nuova chat</span>';
$('#mic').innerHTML=ic('mic');$('#send').innerHTML=ic('send');$('#hl').innerHTML=LOGO;

let chats=[],cur=null,busy=false,theme='dark';
try{chats=JSON.parse(localStorage.getItem('az1q')||'[]');theme=localStorage.getItem('az1q-theme')||'dark'}catch(e){}
const save=()=>{try{localStorage.setItem('az1q',JSON.stringify(chats.slice(0,40)))}catch(e){}};
function applyTheme(){document.documentElement.dataset.theme=theme;$('#th').innerHTML=ic(theme==='dark'?'sun':'moon')+'<span>'+(theme==='dark'?'Tema chiaro':'Tema scuro')+'</span>';try{localStorage.setItem('az1q-theme',theme)}catch(e){}}
$('#th').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};applyTheme();

/* ---------- Question understanding (many languages) ---------- */
const P=[
['it',/^(che cos'è|che cosa è|che cosa sono|che cos'era|cos'è|cosa è|cosa sono|chi è|chi era|chi sono|parlami di|spiegami|definisci|cosa)\s*/i,/^(un'|un|uno|una|il|lo|la|l'|i|gli|le|di|del|della)\s*/i],
['en',/^(what is|what are|what was|what's|whats|who is|who was|who are|tell me about|explain|define|what)\s+/i,/^(a|an|the|about)\s+/i],
['fr',/^(qu'est-ce que c'est|qu'est-ce qu'un|qu'est-ce qu'une|qu'est-ce que|qu'est ce que|c'est quoi|qui est|qui était|que sont|qu'est)\s*/i,/^(un|une|le|la|les|l'|des)\s*/i],
['es',/^(qué es|que es|qué son|quién es|quien es|qué fue|qué significa|que significa)\s+/i,/^(un|una|el|la|los|las)\s+/i],
['de',/^(was ist|was sind|wer ist|wer war|was bedeutet)\s+/i,/^(ein|eine|der|die|das)\s+/i],
['pt',/^(o que é|o que são|quem é|quem foi|o que significa)\s+/i,/^(um|uma|o|a|os|as)\s+/i],
['nl',/^(wat is|wat zijn|wie is|wie was)\s+/i,/^(een|de|het)\s+/i],
['ru',/^(что такое|что это|кто такой|кто такая|что)\s+/i,null],
['uk',/^(що таке|хто такий|хто така)\s+/i,null],
['ar',/^(ما هو|ما هي|من هو|من هي|ما)\s+/,null],
['tr',/^(.+?)\s+(nedir|kimdir)$/i,null],
['zh',/^(什么是|什麼是|谁是|誰是)/,null],
['ja',/^(.+?)(とは|って何|は何)/,null],
['ko',/^(.+?)(이란|란|이 뭐야|가 뭐야|이 무엇)/,null],
['hi',/^(.+?)\s+(क्या है|कौन है)$/,null]
];
/* Correction engine: fixes misspelled question words (cose -> cos'è, wat is -> what is) */
const PHR=["cos'è","che cos'è","cosa è","che cosa è","chi è","cosa sono","what is","what are","who is","qu'est-ce que","qui est","qué es","quién es","was ist","wer ist","o que é","quem é","wat is","wie is"];
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f'’`]/g,'');
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]}
function fixHead(q){
  const w=q.split(' ');
  for(let n=Math.min(3,w.length-1);n>=1;n--){
    const head=nz(w.slice(0,n).join(' '));let best=null;
    for(const ph of PHR){
      const p=nz(ph),d=lev(head,p),max=p.length>=8?2:1;
      if(p.length>=4&&d<=max&&(!best||d<best.d))best={d,ph};
    }
    if(best)return best.ph+' '+w.slice(n).join(' ');
  }
  return q;
}
function run(q){
  for(const [lang,re,art] of P){
    const m=q.match(re);if(!m)continue;
    let t=(lang==='ja'||lang==='ko'||lang==='tr'||lang==='hi')?m[1]:q.replace(re,'');
    if(art)t=t.replace(art,'');
    t=t.trim();if(t)return{lang,topic:t};
  }
  return null;
}
function parse(q){
  q=q.trim().replace(/\s+/g,' ').replace(/[’`]/g,"'").replace(/[?？!.¿¡]+$/g,'').replace(/^[¿¡]/,'').trim();
  let r=run(q);
  if(!r){const f=fixHead(q);if(f!==q){r=run(f);if(r)r.fixed=f}}
  return r;
}

/* ---------- Wikipedia ---------- */
async function wiki(lang,topic){
  const j=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
  const S=t=>j(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(t)}&srlimit=5&srinfo=suggestion&format=json&origin=*`);
  let s=await S(topic),fix=null;
  const sg=s.query&&s.query.searchinfo&&s.query.searchinfo.suggestion;
  const exact=((s.query&&s.query.search)||[]).some(h=>h.title.toLowerCase()===topic.toLowerCase());
  if(sg&&!exact&&sg.toLowerCase()!==topic.toLowerCase()){fix=sg;topic=sg;s=await S(sg)}
  const hits=(s.query&&s.query.search)||[];
  if(!hits.length)return null;
  const low=topic.toLowerCase();
  hits.sort((a,b)=>(b.title.toLowerCase()===low)-(a.title.toLowerCase()===low));
  for(const h of hits){
    const d=await j(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(h.title)}`);
    if(d.type==='disambiguation'||!d.extract)continue;
    return{title:d.title,text:d.extract,img:d.thumbnail&&d.thumbnail.source,url:d.content_urls&&d.content_urls.desktop.page,lang,fix};
  }
  return null;
}

/* ---------- UI ---------- */
const cc=()=>chats.find(x=>x.id===cur);
const closeSide=()=>$('#side').classList.add('hide');
function newChat(){cur=null;render();hist();closeSide();$('#in').focus()}
function hist(){
  const h=$('#hist');h.innerHTML='';
  chats.forEach(c=>{
    const d=document.createElement('div');d.className='h'+(c.id===cur?' on':'');
    const s=document.createElement('span');s.textContent=c.title;
    const b=document.createElement('button');b.innerHTML=ic('trash');b.setAttribute('aria-label','Elimina');
    b.onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x!==c);if(cur===c.id)cur=null;save();hist();render()};
    d.onclick=()=>{cur=c.id;render();hist();closeSide()};
    d.append(s,b);h.appendChild(d);
  });
}
function actions(m){
  const a=document.createElement('div');a.className='acts';
  const mk=(n,l,f,cls)=>{const b=document.createElement('button');b.className='ib '+(cls||'');b.innerHTML=ic(n);b.title=l;b.setAttribute('aria-label',l);b.onclick=()=>f(b);return b};
  a.append(
    mk('up','Mi piace',b=>{b.style.color='var(--ac)';fb(m,1)}),
    mk('up','Non mi piace',b=>{b.style.color='var(--ac)';fb(m,-1)},'dn'),
    mk('refresh','Rigenera',()=>regen()),
    mk('copy','Copia',b=>{try{navigator.clipboard.writeText((m.title?m.title+'\n':'')+m.t)}catch(e){}b.innerHTML=ic('check')})
  );
  return a;
}
function bubble(m,anim){
  const d=document.createElement('div');d.className='m '+(m.r==='u'?'u':'a');
  const b=document.createElement('div');b.className='b';
  if(m.r==='u'){b.textContent=m.t;d.appendChild(b);return d}
  const lg=document.createElement('div');lg.className='lg';lg.innerHTML=LOGO;d.appendChild(lg);
  if(m.dots){b.innerHTML='<div class="th"><span class="spin">'+ic('load')+'</span><b>'+(m.label||'Sto pensando')+'...</b></div>';d.appendChild(b);return d}
  if(m.fix){const f=document.createElement('div');f.className='fix';f.innerHTML=ic('edit');const s=document.createElement('span');s.textContent='Hai scritto "'+m.fix.from+'". Ho corretto e rimandato: "'+m.fix.to+'"';f.appendChild(s);b.appendChild(f)}
  if(m.note){const n=document.createElement('div');n.className='note';n.innerHTML=ic('search');n.append(m.note);b.appendChild(n)}
  if(m.steps&&m.steps.length){const d=document.createElement('details');d.className='tr';d.innerHTML='<summary>Come ho ragionato</summary>';const o=document.createElement('ol');m.steps.forEach(x=>{const l=document.createElement('li');l.textContent=x;o.appendChild(l)});d.appendChild(o);b.appendChild(d)}
  if(m.title){const h=document.createElement('h3');h.textContent=m.title;b.appendChild(h)}
  const card=document.createElement('div');card.className='card';
  const p=document.createElement('div');p.style.flex='1';
  if(m.img){const i=document.createElement('img');i.src=m.img;i.alt='';card.append(p,i)}else card.append(p);
  b.appendChild(card);
  const extra=document.createElement('div');

  if(q.search(CW)>=0){step('Immagino');return ok(await imagine(q,L,step))}
  if(hits.length&&hits[0].s>=1.2){const h=hits[0].m;return ok({note:'Dalla mia memoria',t:h.c?h.f:'Lo ricordo: '+h.f,title:h.c?h.k:'',img:h.i,url:h.u,used})}
  try{
    let r,fq=p&&p.fixed||null;
    if(p){step('Cerco su Wikipedia ('+p.lang.toUpperCase()+')');r=await wiki(p.lang,p.topic);if(!r&&p.lang!=='en')r=await wiki('en',p.topic)}
    if(r){
      if(r.fix){const base=fq||q.trim().replace(/[?？!.]+$/,'');const i=base.toLowerCase().lastIndexOf(p.topic.toLowerCase());fq=i>=0?base.slice(0,i)+r.fix:base+' '+r.fix}
      train(r.text);learn(r.text,r.title,1,{u:r.url,i:r.img});S.push('Ho imparato questo argomento');
      return ok({fix:fq?{from:q.trim(),to:fq}:null,note:`Cercato su Wikipedia (${r.lang.toUpperCase()}): ${r.fix||p.topic}`,title:r.title,t:r.text,img:r.img,url:r.url,used})}
    step('Cerco sul web');
    const[w,d]=await Promise.all([wsearch(q,L).catch(()=>[]),ddg(q)]),docs=[...w,d].filter(Boolean);
    if(docs.length){step('Leggo '+docs.length+' fonti e scelgo le frasi migliori');const all=docs.map(x=>x.text).join(' ');train(all);
      const t=best(q,all,3),x=docs[0];learn(t,x.title,1,{u:x.url,i:x.img});S.push('Ho imparato questo argomento');
      return ok({title:x.title,t,img:x.img,url:x.url,sl:w[0]?undefined:'Apri la fonte',note:'Fonti: '+(w.length?'Wikipedia '+L.toUpperCase():'')+(d?(w.length?' + ':'')+'DuckDuckGo':''),used})}
    return ok({t:'Non ho trovato niente. Prova con altre parole, oppure incolla il link di un sito e lo leggo.'})
  }catch(e){return ok({t:'Non riesco a collegarmi al web. Controlla la connessione e apri il file direttamente nel browser.'})}
}

/* ---------- microphone ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
$('#mic').onclick=()=>{
  if(!SR){alert('Il microfono non è supportato da questo browser. Prova con Chrome.');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=navigator.language||'it-IT';rec.interimResults=true;
  $('#mic').classList.add('rec');inp.placeholder='Sto ascoltando...';
  rec.onresult=e=>{inp.value=[...e.results].map(r=>r[0].transcript).join('');inp.oninput()};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec');inp.placeholder='Chiedi ad Az1Q';if(inp.value.trim())go()};
  rec.onerror=()=>{};
  rec.start();
};
